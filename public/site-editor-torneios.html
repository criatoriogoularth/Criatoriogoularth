<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviário — Copas e Torneios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.editor-card {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.editor-card h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--brass-soft);
  margin-bottom: 6px;
}
.editor-card .desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}
.field label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}
.field input,
.field select,
.field textarea {
  background: rgba(0,0,0,0.35) !important;
  border: 1px solid var(--line) !important;
  border-radius: 6px !important;
  padding: 8px 10px !important;
  color: var(--text) !important;
  font-size: 13px !important;
  outline: none !important;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brass) !important;
}
.field-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.field-row .field {
  flex: 1;
  min-width: 150px;
}

/* ---- categoria (grupo) ---- */
.categoria-group {
  margin-bottom: 22px;
}
.categoria-group .categoria-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--brass-dim);
  margin-bottom: 10px;
}
.categoria-group .categoria-header h4 {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  color: var(--text);
}
.categoria-group .categoria-header .count {
  font-size: 11px;
  color: var(--text-muted);
}

/* ---- item de etapa (arrastável) ---- */
.etapa-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.15);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  cursor: grab;
}
.etapa-item:active { cursor: grabbing; }
.etapa-item.dragging { opacity: 0.4; }
.etapa-item.drag-over { border-color: var(--brass); background: rgba(199,151,63,0.1); }
.etapa-item.oculta { opacity: 0.5; }
.etapa-item .handle { color: var(--text-muted); font-size: 15px; flex-shrink: 0; }
.etapa-item .info { flex: 1; min-width: 0; }
.etapa-item .info .nome {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--text);
}
.etapa-item .info .meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.etapa-item .status-badge {
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 600;
  flex-shrink: 0;
}
.etapa-item .status-visivel {
  background: rgba(92, 154, 124, 0.2);
  color: var(--sage-soft);
}
.etapa-item .status-oculta {
  background: rgba(192, 89, 74, 0.15);
  color: #e2988a;
}
.etapa-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.etapa-item .actions .btn {
  padding: 4px 10px;
  font-size: 11px;
}
.empty-list {
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
}

/* ---- tabela de resultados (dentro do modal) ---- */
.resultados-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
}
.resultados-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--text-muted);
  text-align: left;
  padding: 4px 6px;
}
.resultados-table td {
  padding: 3px 4px;
}
.resultados-table input {
  width: 100%;
  background: rgba(0,0,0,0.35) !important;
  border: 1px solid var(--line) !important;
  border-radius: 5px !important;
  padding: 6px 8px !important;
  color: var(--text) !important;
  font-size: 12.5px !important;
}
.resultados-table .col-pos { width: 60px; }
.resultados-table .col-tempo { width: 90px; }
.resultados-table .col-pontos { width: 70px; }
.resultados-table .col-acao { width: 34px; }
.resultados-table .btn-remover-linha {
  background: none;
  border: none;
  color: #e2988a;
  cursor: pointer;
  font-size: 15px;
  padding: 2px 6px;
}
.btn-add-linha {
  margin-top: 8px;
  padding: 6px 14px;
  font-size: 12px;
}
.toggle-visivel {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.toggle-visivel input { width: auto !important; flex-shrink: 0; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <button class="burger" onclick="toggleSidebar()">☰ menu</button>
    <section class="page active">

      <div class="topbar">
        <div>
          <h1>🏆 Copas e Torneios</h1>
          <div class="lede">Cadastre categorias (ex: "Copa ABCO Livre Adulto 2026") e etapas com tabela de resultados — aparecem no site público.</div>
        </div>
        <div>
          <button class="btn btn-ghost" onclick="location.href='admin-site.html'">← Voltar</button>
          <button class="btn btn-primary" onclick="abrirModalEtapa()">+ Nova Etapa</button>
        </div>
      </div>

      <div class="editor-card">
        <h3>📋 Etapas cadastradas</h3>
        <div class="desc">Agrupadas por categoria. Arraste (☰) para reordenar dentro da mesma categoria — essa ordem é a que aparece no site.</div>
        <div id="torneios-list"></div>
      </div>

    </section>
  </main>
</div>

<script src="auth-client.js"></script>
<script src="sidebar.js"></script>
<script src="db-api.js"></script>
<script>
renderSidebar('admin-site');

// ============================================================
// ESTADO
// ============================================================

let torneios = [];
let _arrastando = null;

// ============================================================
// CARREGAR / RENDERIZAR
// ============================================================

async function carregarTorneios() {
  try {
    torneios = await DB.getTorneios();
  } catch (erro) {
    torneios = [];
    alert('❌ Não foi possível carregar as copas/torneios: ' + erro.message);
  }
  renderizarLista();
}

function agruparPorCategoria(lista) {
  const grupos = {};
  lista.forEach(t => {
    if (!grupos[t.categoria]) grupos[t.categoria] = [];
    grupos[t.categoria].push(t);
  });
  Object.values(grupos).forEach(arr => arr.sort((a, b) => (a.ordem || 0) - (b.ordem || 0)));
  return grupos;
}

function formatarData(data) {
  if (!data) return '';
  const partes = String(data).slice(0, 10).split('-');
  if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
  return data;
}

function renderizarLista() {
  const container = document.getElementById('torneios-list');

  if (torneios.length === 0) {
    container.innerHTML = '<div class="empty-list">Nenhuma copa/torneio cadastrado ainda.</div>';
    return;
  }

  const grupos = agruparPorCategoria(torneios);

  let html = '';
  Object.entries(grupos).forEach(([categoria, etapas]) => {
    html += `
      <div class="categoria-group">
        <div class="categoria-header">
          <h4>${categoria}</h4>
          <span class="count">${etapas.length} etapa${etapas.length > 1 ? 's' : ''}</span>
        </div>
        <div class="etapas-container" data-categoria="${categoria.replace(/"/g, '&quot;')}">
          ${etapas.map(t => `
            <div class="etapa-item ${t.visivel === false ? 'oculta' : ''}" draggable="true" data-id="${t.id}">
              <span class="handle">☰</span>
              <div class="info">
                <div class="nome">${t.etapa}</div>
                <div class="meta">${formatarData(t.data) || 'sem data'} · ${(t.resultados || []).length} resultado${(t.resultados || []).length !== 1 ? 's' : ''}</div>
              </div>
              <span class="status-badge ${t.visivel === false ? 'status-oculta' : 'status-visivel'}">${t.visivel === false ? '🔒 Oculta' : '✅ Visível'}</span>
              <div class="actions">
                <button class="btn btn-ghost" onclick="abrirModalEtapa(${t.id})">✎ Editar</button>
                <button class="btn btn-ghost" onclick="alternarVisibilidade(${t.id})">${t.visivel === false ? '👁️ Mostrar' : '🙈 Ocultar'}</button>
                <button class="btn btn-danger" onclick="excluirEtapa(${t.id})">🗑️</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  ativarDragDrop();
}

function ativarDragDrop() {
  document.querySelectorAll('.etapas-container').forEach(cont => {
    cont.querySelectorAll('.etapa-item').forEach(item => {
      item.addEventListener('dragstart', () => {
        _arrastando = { id: Number(item.dataset.id), categoria: cont.dataset.categoria };
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        cont.querySelectorAll('.etapa-item').forEach(el => el.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (!_arrastando || _arrastando.categoria !== cont.dataset.categoria) return;
        if (Number(item.dataset.id) === _arrastando.id) return;
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', async (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        if (!_arrastando || _arrastando.categoria !== cont.dataset.categoria) return;

        const destinoId = Number(item.dataset.id);
        if (_arrastando.id === destinoId) return;

        const grupo = torneios.filter(t => t.categoria === cont.dataset.categoria).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
        const origemIdx = grupo.findIndex(t => t.id === _arrastando.id);
        const destinoIdx = grupo.findIndex(t => t.id === destinoId);
        const [movido] = grupo.splice(origemIdx, 1);
        grupo.splice(destinoIdx, 0, movido);

        const itens = grupo.map((t, idx) => ({ id: t.id, ordem: idx }));
        grupo.forEach((t, idx) => { t.ordem = idx; });

        try {
          await DB.reordenarTorneios(itens);
        } catch (erro) {
          alert('❌ Não foi possível salvar a nova ordem: ' + erro.message);
        }
        renderizarLista();
      });
    });
  });
}

// ============================================================
// AÇÕES RÁPIDAS
// ============================================================

async function alternarVisibilidade(id) {
  const t = torneios.find(x => x.id === id);
  if (!t) return;
  const novoValor = t.visivel === false ? true : false;
  try {
    await DB.updateTorneio(id, { visivel: novoValor });
    t.visivel = novoValor;
    renderizarLista();
  } catch (erro) {
    alert('❌ Não foi possível alterar a visibilidade: ' + erro.message);
  }
}

async function excluirEtapa(id) {
  if (!confirm('Excluir esta etapa e todos os resultados dela? Essa ação não pode ser desfeita.')) return;
  try {
    await DB.deleteTorneio(id);
    torneios = torneios.filter(t => t.id !== id);
    renderizarLista();
  } catch (erro) {
    alert('❌ Não foi possível excluir: ' + erro.message);
  }
}

// ============================================================
// MODAL DE ADICIONAR/EDITAR ETAPA
// ============================================================

let _linhaResultadoSeq = 0;

function categoriasExistentes() {
  return [...new Set(torneios.map(t => t.categoria))].sort();
}

function abrirModalEtapa(id) {
  const editando = typeof id === 'number';
  const t = editando ? torneios.find(x => x.id === id) : {
    categoria: '', etapa: '', data: '', visivel: true, resultados: []
  };
  if (editando && !t) return;

  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  `;

  const modal = document.createElement('div');
  modal.style.cssText = `
    background: var(--bg-elevated-2); border: 1px solid var(--brass-dim);
    border-radius: 14px; max-width: 720px; width: 100%;
    padding: 24px; max-height: 90vh; overflow-y: auto;
  `;

  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-family:'Fraunces',serif;color:var(--brass-soft);">${editando ? '✎ Editar Etapa' : '+ Nova Etapa'}</h3>
      <button onclick="document.querySelectorAll('div[style*=&quot;position: fixed&quot;]').forEach(el => el.remove())" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">✕</button>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Categoria *</label>
        <input type="text" id="etapa-categoria" list="categorias-lista" value="${t.categoria || ''}" placeholder="Ex: Copa ABCO Livre Adulto 2026">
        <datalist id="categorias-lista">
          ${categoriasExistentes().map(c => `<option value="${c}">`).join('')}
        </datalist>
      </div>
      <div class="field">
        <label>Nome da Etapa *</label>
        <input type="text" id="etapa-nome" value="${t.etapa || ''}" placeholder="Ex: 1ª Etapa">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Data</label>
        <input type="date" id="etapa-data" value="${t.data ? String(t.data).slice(0, 10) : ''}">
      </div>
      <div class="field" style="justify-content:flex-end;">
        <label class="toggle-visivel">
          <input type="checkbox" id="etapa-visivel" ${t.visivel !== false ? 'checked' : ''}>
          Visível no site público
        </label>
      </div>
    </div>

    <div class="field">
      <label>Resultados</label>
      <table class="resultados-table">
        <thead>
          <tr>
            <th class="col-pos">Pos.</th>
            <th>Ave</th>
            <th>Anilha</th>
            <th class="col-tempo">Tempo</th>
            <th class="col-pontos">Pontos</th>
            <th class="col-acao"></th>
          </tr>
        </thead>
        <tbody id="resultados-tbody"></tbody>
      </table>
      <button type="button" class="btn btn-ghost btn-add-linha" onclick="adicionarLinhaResultado()">+ Adicionar linha</button>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
      <button onclick="salvarModalEtapa(${editando ? id : 'null'})" class="btn btn-primary" style="flex:1;">💾 Salvar</button>
    </div>
  `;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const tbody = document.getElementById('resultados-tbody');
  tbody.innerHTML = '';
  const resultadosIniciais = Array.isArray(t.resultados) && t.resultados.length > 0
    ? t.resultados
    : [{ pos: '', ave: '', anilha: '', tempo: '', pontos: '' }];
  resultadosIniciais.forEach(r => adicionarLinhaResultado(r));
}

function adicionarLinhaResultado(dados) {
  const r = dados || { pos: '', ave: '', anilha: '', tempo: '', pontos: '' };
  const linhaId = 'linha-' + (_linhaResultadoSeq++);
  const tbody = document.getElementById('resultados-tbody');
  if (!tbody) return;

  const tr = document.createElement('tr');
  tr.id = linhaId;
  tr.innerHTML = `
    <td class="col-pos"><input type="text" class="res-pos" value="${r.pos || ''}" placeholder="1º"></td>
    <td><input type="text" class="res-ave" value="${r.ave || ''}" placeholder="Nome da ave"></td>
    <td><input type="text" class="res-anilha" value="${r.anilha || ''}" placeholder="II 0000 0000 0000"></td>
    <td class="col-tempo"><input type="text" class="res-tempo" value="${r.tempo || ''}" placeholder="00:00.00"></td>
    <td class="col-pontos"><input type="text" class="res-pontos" value="${r.pontos || ''}" placeholder="30"></td>
    <td class="col-acao"><button type="button" class="btn-remover-linha" onclick="document.getElementById('${linhaId}').remove()">✕</button></td>
  `;
  tbody.appendChild(tr);
}

async function salvarModalEtapa(id) {
  const categoria = document.getElementById('etapa-categoria').value.trim();
  const etapa = document.getElementById('etapa-nome').value.trim();
  const data = document.getElementById('etapa-data').value || null;
  const visivel = document.getElementById('etapa-visivel').checked;

  if (!categoria) { alert('Informe a categoria.'); return; }
  if (!etapa) { alert('Informe o nome da etapa.'); return; }

  const resultados = [];
  document.querySelectorAll('#resultados-tbody tr').forEach(tr => {
    const pos = tr.querySelector('.res-pos').value.trim();
    const ave = tr.querySelector('.res-ave').value.trim();
    const anilha = tr.querySelector('.res-anilha').value.trim();
    const tempo = tr.querySelector('.res-tempo').value.trim();
    const pontos = tr.querySelector('.res-pontos').value.trim();
    if (pos || ave || anilha || tempo || pontos) {
      resultados.push({ pos, ave, anilha, tempo, pontos });
    }
  });

  const dados = { categoria, etapa, data, visivel, resultados };

  try {
    if (id === null || id === undefined) {
      const novo = await DB.addTorneio(dados);
      torneios.push(novo);
    } else {
      const atualizado = await DB.updateTorneio(id, dados);
      const idx = torneios.findIndex(t => t.id === id);
      if (idx !== -1) torneios[idx] = atualizado;
    }
  } catch (erro) {
    alert('❌ Não foi possível salvar: ' + erro.message);
    return;
  }

  renderizarLista();
  document.querySelectorAll('div[style*="position: fixed"]').forEach(el => el.remove());
}

// ============================================================
// INICIALIZAR
// ============================================================

carregarTorneios();
</script>
</body>
</html>
