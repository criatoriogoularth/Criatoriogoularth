<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviário — Copas e Torneios</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.editor-card {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.editor-card h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--brass-soft);
  margin-bottom: 6px;
}
.editor-card .desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}
.field label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}
.field input,
.field select,
.field textarea {
  background: rgba(0,0,0,0.35) !important;
  border: 1px solid var(--line) !important;
  border-radius: 6px !important;
  padding: 8px 10px !important;
  color: var(--text) !important;
  font-size: 13px !important;
  outline: none !important;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brass) !important;
}
.checkbox-field {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.checkbox-field input { width: auto !important; }
.checkbox-field label { font-size: 13px; color: var(--text); font-weight: 500; }
.upload-area {
  border: 2px dashed var(--line);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  cursor: pointer;
  background: rgba(0,0,0,0.1);
  flex-shrink: 0;
}
.upload-area:hover {
  border-color: var(--brass-dim);
}
.upload-area p {
  color: var(--text-muted);
  font-size: 11px;
}
.upload-area input[type="file"] {
  display: none;
}

/* ---- lista de etapas, agrupada por categoria (arrastável) ---- */
.categoria-grupo {
  margin-bottom: 22px;
}
.categoria-grupo .categoria-nome {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  color: var(--brass-soft);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 10px;
}
.etapa-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.15);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 10px;
  cursor: grab;
}
.etapa-item:active { cursor: grabbing; }
.etapa-item.dragging { opacity: 0.4; }
.etapa-item.drag-over { border-color: var(--brass); background: rgba(199,151,63,0.1); }
.etapa-item .handle { color: var(--text-muted); font-size: 15px; flex-shrink: 0; }
.etapa-item .thumb {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid var(--line);
  flex-shrink: 0;
  background: rgba(0,0,0,0.2);
}
.etapa-item .thumb.pdf-icon,
.etapa-item .thumb.sem-arquivo {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  opacity: 0.6;
}
.etapa-item .info { flex: 1; min-width: 0; }
.etapa-item .info .nome {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.etapa-item .info .meta {
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 2px;
}
.etapa-item .info .badge-oculto {
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 10px;
  background: rgba(192,89,74,0.2);
  color: #e2988a;
}
.etapa-item .actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.etapa-item .actions .btn {
  padding: 4px 10px;
  font-size: 11px;
}
.empty-list {
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <button class="burger" onclick="toggleSidebar()">☰ menu</button>
    <section class="page active">

      <div class="topbar">
        <div>
          <h1>🏆 Copas e Torneios</h1>
          <div class="lede">Cada etapa é um link que abre a imagem ou o PDF do resultado — sem tabela pra preencher, você só sobe o arquivo já pronto.</div>
        </div>
        <div>
          <button class="btn btn-ghost" onclick="location.href='admin-site.html'">← Voltar</button>
          <button class="btn btn-primary" onclick="abrirModalEtapa()">+ Adicionar Link</button>
        </div>
      </div>

      <div class="editor-card">
        <h3>📄 Links cadastrados</h3>
        <div class="desc">Agrupados por categoria (ex: "Copa ABCO Livre Adulto 2026"). Arraste (☰) pra reordenar dentro da mesma categoria.</div>
        <div id="etapas-list"></div>
      </div>

    </section>
  </main>
</div>

<script src="auth-client.js"></script>
<script src="sidebar.js"></script>
<script src="db-api.js"></script>
<script>
renderSidebar('site-editor-torneios');

// ============================================================
// ESTADO
// ============================================================

let etapas = [];
let _etapaArrastando = null;

// ============================================================
// CARREGAR / RENDERIZAR
// ============================================================

async function carregarEtapas() {
  try {
    etapas = await DB.getTorneios();
  } catch (e) {
    etapas = [];
  }
  renderizarEtapas();
}

function agruparPorCategoria(lista) {
  const grupos = {};
  lista.forEach(t => {
    const cat = t.categoria || 'Sem categoria';
    if (!grupos[cat]) grupos[cat] = [];
    grupos[cat].push(t);
  });
  return grupos;
}

function formatarData(data) {
  if (!data) return '';
  const partes = String(data).slice(0, 10).split('-');
  if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
  return data;
}

function renderizarEtapas() {
  const container = document.getElementById('etapas-list');

  if (etapas.length === 0) {
    container.innerHTML = '<div class="empty-list">Nenhum link cadastrado ainda.</div>';
    return;
  }

  const grupos = agruparPorCategoria(etapas);

  let html = '';
  Object.entries(grupos).forEach(([categoria, lista]) => {
    html += `
      <div class="categoria-grupo" data-categoria="${categoria}">
        <div class="categoria-nome">${categoria}</div>
        ${lista.map(t => {
          const idx = etapas.indexOf(t);
          let thumbHtml = '<div class="thumb sem-arquivo">📄</div>';
          if (t.arquivoTipo === 'pdf') {
            thumbHtml = '<div class="thumb pdf-icon">📕</div>';
          } else if (t.arquivoUrl) {
            thumbHtml = `<img src="${t.arquivoUrl}" class="thumb" onerror="this.outerHTML='<div class=&quot;thumb sem-arquivo&quot;>🖼️</div>'">`;
          }
          return `
            <div class="etapa-item" draggable="true" data-idx="${idx}">
              <span class="handle">☰</span>
              ${thumbHtml}
              <div class="info">
                <div class="nome">${t.etapa}</div>
                <div class="meta">
                  ${t.data ? `📅 ${formatarData(t.data)}` : ''}
                  ${t.visivel === false ? '<span class="badge-oculto">Oculto</span>' : ''}
                </div>
              </div>
              <div class="actions">
                <button class="btn btn-ghost" onclick="abrirModalEtapa(${idx})">✎ Editar</button>
                <button class="btn btn-danger" onclick="excluirEtapa(${idx})">🗑️</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  });

  container.innerHTML = html;

  container.querySelectorAll('.etapa-item').forEach(item => {
    item.addEventListener('dragstart', () => {
      _etapaArrastando = Number(item.dataset.idx);
      item.classList.add('dragging');
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      container.querySelectorAll('.etapa-item').forEach(el => el.classList.remove('drag-over'));
    });
    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      const destinoIdx = Number(item.dataset.idx);
      if (destinoIdx === _etapaArrastando) return;
      // só permite arrastar dentro da mesma categoria
      if (etapas[destinoIdx].categoria !== etapas[_etapaArrastando].categoria) return;
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', async (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const destinoIdx = Number(item.dataset.idx);
      if (_etapaArrastando === null || _etapaArrastando === destinoIdx) return;
      if (etapas[destinoIdx].categoria !== etapas[_etapaArrastando].categoria) return;

      const [movido] = etapas.splice(_etapaArrastando, 1);
      etapas.splice(destinoIdx, 0, movido);

      // recalcula "ordem" só dentro da categoria afetada
      const categoria = movido.categoria;
      let ordemAtual = 0;
      const itensReordenados = etapas
        .filter(t => t.categoria === categoria)
        .map(t => ({ id: t.id, ordem: ordemAtual++ }));

      try {
        await DB.reordenarTorneios(itensReordenados);
      } catch (erro) {
        alert('❌ Não foi possível salvar a nova ordem: ' + erro.message);
      }
      carregarEtapas();
    });
  });
}

// ============================================================
// MODAL DE ADICIONAR/EDITAR
// ============================================================

function categoriasExistentes() {
  return [...new Set(etapas.map(t => t.categoria).filter(Boolean))];
}

function abrirModalEtapa(idx) {
  const editando = typeof idx === 'number';
  const etapa = editando ? etapas[idx] : { categoria: '', etapa: '', data: '', visivel: true, arquivoUrl: '', arquivoTipo: 'imagem' };

  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px;
  `;

  const modal = document.createElement('div');
  modal.style.cssText = `
    background: var(--bg-elevated-2); border: 1px solid var(--brass-dim);
    border-radius: 14px; max-width: 480px; width: 100%;
    padding: 24px; max-height: 90vh; overflow-y: auto;
  `;

  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-family:'Fraunces',serif;color:var(--brass-soft);">${editando ? '✎ Editar Link' : '+ Novo Link'}</h3>
      <button onclick="document.querySelectorAll('div[style*=&quot;position: fixed&quot;]').forEach(el => el.remove())" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">✕</button>
    </div>

    <div class="field">
      <label>Categoria *</label>
      <input type="text" id="etapa-categoria" value="${etapa.categoria || ''}" placeholder="Ex: Copa ABCO Livre Adulto 2026" list="categorias-existentes">
      <datalist id="categorias-existentes">
        ${categoriasExistentes().map(c => `<option value="${c}">`).join('')}
      </datalist>
    </div>

    <div class="field">
      <label>Nome do link *</label>
      <input type="text" id="etapa-nome" value="${etapa.etapa || ''}" placeholder="Ex: 1ª Etapa Copa ABCO Livre Adulto 18/04/2026">
    </div>

    <div class="field">
      <label>Data (opcional)</label>
      <input type="date" id="etapa-data" value="${etapa.data ? String(etapa.data).slice(0,10) : ''}">
    </div>

    <div class="field">
      <label>Arquivo do resultado (imagem ou PDF) *</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="upload-area" onclick="document.getElementById('etapa-file-input').click()" style="flex:1;">
          <p>📤 Clique para subir imagem ou PDF</p>
          <input type="file" id="etapa-file-input" accept="image/*,application/pdf" onchange="uploadArquivoEtapa(event)">
        </div>
      </div>
      <div id="etapa-arquivo-preview" style="margin-top:8px;">
        ${etapa.arquivoUrl
          ? (etapa.arquivoTipo === 'pdf'
              ? `<div style="font-size:12px;color:var(--brass-soft);">📕 PDF já enviado</div>`
              : `<img src="${etapa.arquivoUrl}" style="max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--line);" onerror="this.style.display='none'">`)
          : ''}
      </div>
    </div>
    <input type="hidden" id="etapa-arquivo-url" value="${etapa.arquivoUrl || ''}">
    <input type="hidden" id="etapa-arquivo-tipo" value="${etapa.arquivoTipo || 'imagem'}">

    <div class="checkbox-field">
      <input type="checkbox" id="etapa-visivel" ${etapa.visivel !== false ? 'checked' : ''}>
      <label for="etapa-visivel">Visível no site</label>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
      <button onclick="salvarModalEtapa(${editando ? idx : 'null'})" class="btn btn-primary" style="flex:1;">💾 Salvar</button>
    </div>
  `;

  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

function uploadArquivoEtapa(event) {
  const file = event.target.files[0];
  if (!file) return;

  const ehImagem = file.type.startsWith('image/');
  const ehPdf = file.type === 'application/pdf';

  if (!ehImagem && !ehPdf) {
    alert('Selecione uma imagem ou um arquivo PDF.');
    return;
  }
  if (file.size > 10 * 1024 * 1024) {
    alert('O arquivo excede 10MB.');
    return;
  }

  const reader = new FileReader();
  reader.onload = function (e) {
    document.getElementById('etapa-arquivo-url').value = e.target.result;
    document.getElementById('etapa-arquivo-tipo').value = ehPdf ? 'pdf' : 'imagem';

    const preview = document.getElementById('etapa-arquivo-preview');
    preview.innerHTML = ehPdf
      ? `<div style="font-size:12px;color:var(--brass-soft);">📕 PDF selecionado: ${file.name}</div>`
      : `<img src="${e.target.result}" style="max-width:140px;max-height:140px;border-radius:8px;border:1px solid var(--line);">`;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function salvarModalEtapa(idx) {
  const categoria = document.getElementById('etapa-categoria').value.trim();
  const nomeEtapa = document.getElementById('etapa-nome').value.trim();
  const data = document.getElementById('etapa-data').value;
  const visivel = document.getElementById('etapa-visivel').checked;
  const arquivoUrl = document.getElementById('etapa-arquivo-url').value;
  const arquivoTipo = document.getElementById('etapa-arquivo-tipo').value;

  if (!categoria) {
    alert('Digite a categoria.');
    return;
  }
  if (!nomeEtapa) {
    alert('Digite o nome do link.');
    return;
  }
  if (!arquivoUrl) {
    alert('Suba a imagem ou o PDF do resultado.');
    return;
  }

  const dados = { categoria, etapa: nomeEtapa, data: data || null, visivel, arquivoUrl, arquivoTipo };

  try {
    if (idx === null || idx === undefined) {
      await DB.addTorneio(dados);
    } else {
      await DB.updateTorneio(etapas[idx].id, dados);
    }
  } catch (erro) {
    alert('❌ Não foi possível salvar: ' + erro.message);
    return;
  }

  await carregarEtapas();
  document.querySelectorAll('div[style*="position: fixed"]').forEach(el => el.remove());
}

async function excluirEtapa(idx) {
  if (!confirm('Remover este link e o arquivo associado?')) return;
  try {
    await DB.deleteTorneio(etapas[idx].id);
  } catch (erro) {
    alert('❌ Não foi possível excluir: ' + erro.message);
    return;
  }
  await carregarEtapas();
}

// ============================================================
// INICIALIZAR
// ============================================================

carregarEtapas();
</script>
</body>
</html>
