<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviari — Nova senha</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.cad-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,rgba(199,151,63,0.08),transparent 55%),var(--bg);}
.cad-card{width:100%;max-width:430px;background:var(--bg-elevated-2);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 8px 40px rgba(var(--shade),0.3);}
.cad-card .ring{width:58px;height:58px;border-radius:50%;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(199,151,63,0.06);margin:0 auto 12px;}
.cad-card h2{margin:0 0 6px;font-size:20px;color:var(--brass-soft);text-align:center;}
.cad-card .sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:20px;line-height:1.5;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
.field label{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.field input{background:var(--input-bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--text);font-size:16px;outline:none;font-family:'Manrope',sans-serif;}
.field input:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(199,151,63,0.15);}
.btn-cad{width:100%;padding:13px;border-radius:8px;background:linear-gradient(135deg,var(--brass-soft),var(--brass));color:var(--on-brass);border:none;font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;cursor:pointer;}
.btn-cad:disabled{opacity:.6;cursor:not-allowed;}
.msg{font-size:13px;text-align:center;margin-top:12px;min-height:18px;line-height:1.5;}
.ok{color:#7fd18b;}.ruim{color:var(--danger-text,#ff8a80);}
.ja{font-size:12.5px;text-align:center;margin-top:18px;}.ja a{color:var(--brass-soft);}
</style>
</head>
<body>
<div class="cad-wrap"><div class="cad-card">

  <div class="ring">🔒</div>
  <h2>Criar nova senha</h2>
  <div class="sub" id="sub">Escolha uma senha com pelo menos 8 caracteres.</div>
  <div id="form">
    <div class="field"><label>Nova senha</label><input type="password" id="s1" autocomplete="new-password"></div>
    <div class="field"><label>Repita a nova senha</label><input type="password" id="s2" autocomplete="new-password"></div>
    <button class="btn-cad" id="btn" onclick="salvar()">Salvar a nova senha</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="ja"><a href="login.html">Ir para o login</a> · <a href="esqueci.html">Pedir outro link</a></div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
if (!token) { document.getElementById('form').style.display = 'none'; const m = document.getElementById('msg'); m.className = 'msg ruim'; m.textContent = 'Link incompleto. Peça um novo em “Esqueci a senha”.'; }
async function salvar() {
  const a = document.getElementById('s1').value, b = document.getElementById('s2').value, msg = document.getElementById('msg'), btn = document.getElementById('btn');
  if (a.length < 8) { msg.className = 'msg ruim'; msg.textContent = 'A senha deve ter pelo menos 8 caracteres.'; return; }
  if (a !== b) { msg.className = 'msg ruim'; msg.textContent = 'As senhas não são iguais.'; return; }
  btn.disabled = true; msg.className = 'msg'; msg.textContent = '⏳ Salvando...';
  try {
    const r = await fetch('/api/auth/redefinir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, senha: a }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erro');
    document.getElementById('form').style.display = 'none';
    localStorage.removeItem('token'); localStorage.removeItem('usuario');
    msg.className = 'msg ok'; msg.textContent = '✅ Senha alterada! Já pode entrar com a nova senha.';
    setTimeout(() => { location.href = 'login.html'; }, 2500);
  } catch (e) { msg.className = 'msg ruim'; msg.textContent = '❌ ' + e.message; btn.disabled = false; }
}
</script>
</div></div>
</body>
</html>
