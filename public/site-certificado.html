<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Criatório Goularth — Certificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== TODO O CSS ORIGINAL ===== */
:root {
  --bg: #0d1a16;
  --bg-elevated: #132621;
  --bg-elevated-2: #17302a;
  --parchment: #f3ecda;
  --parchment-dim: #e7dec5;
  --ink: #23291f;
  --ink-soft: #4a5347;
  --brass: #c7973f;
  --brass-soft: #e4c583;
  --brass-dim: rgba(199,151,63,0.28);
  --text: #ece6d6;
  --text-muted: #9aa89e;
  --line: rgba(199,151,63,0.22);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  padding: 20px;
}

.site-header {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
  border-radius: var(--radius);
}

.site-header .logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.site-header .logo .mark {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--brass-soft);
  background: rgba(199,151,63,0.08);
  flex-shrink: 0;
  object-fit: cover;
}

.site-header .logo .mark img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.site-header .logo .name {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--brass-soft);
}

.site-header .logo .sub {
  font-size: 10px;
  color: var(--text-muted);
  display: block;
}

.site-nav a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  transition: .15s ease;
  border: 1px solid transparent;
}

.site-nav a:hover {
  color: var(--text);
  background: rgba(199,151,63,0.08);
  border-color: var(--brass-dim);
}

/* ===== LOADING ===== */
.cert-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  gap: 16px;
  color: var(--text-muted);
}
.cert-loading .spinner {
  width: 48px;
  height: 48px;
  border: 3px solid var(--brass-dim);
  border-top-color: var(--brass);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== CONTAINER DO CERTIFICADO ===== */
.cert-container {
  max-width: 900px;
  margin: 0 auto;
}

/* ===== CERTIFICADO ORIGINAL ===== */
.cert-wrap {
  background: var(--parchment);
  color: var(--ink);
  border-radius: var(--radius);
  padding: 0;
  overflow: hidden;
  width: 100%;
  max-width: 297mm;
  aspect-ratio: 297 / 210;
  margin: 0 auto;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  font-family: 'Manrope', sans-serif;
  display: flex;
  flex-direction: column;
  position: relative;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.cert-wrap.loaded {
  opacity: 1;
}

.cert-bg-color {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: #f3ecda;
}

.cert-bg-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
  opacity: 0.3;
  display: none;
}

.cert-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 20px;
  padding: 8px 20px;
  border-bottom: 2px solid var(--brass);
  background: rgba(199,151,63,0.08);
  flex: 0 0 auto;
  position: relative;
  z-index: 1;
}

.cert-header-left {
  display: flex;
  flex-direction: column;
}

.cert-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--brass);
}

.cert-criador {
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
  margin-top: 1px;
}

.cert-responsavel {
  font-size: 10px;
  color: var(--ink-soft);
  margin-top: 1px;
}

.cert-registros {
  font-size: 9px;
  color: var(--ink-soft);
  margin-top: 1px;
}

.cert-contato {
  font-size: 9px;
  color: var(--ink-soft);
  margin-top: 1px;
}

.cert-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 10px 14px;
  display: flex;
  gap: 12px;
  align-items: stretch;
  position: relative;
  z-index: 1;
}

.cert-subject-panel {
  flex: 0 0 86px;
  height: 180px;
  min-height: 180px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: rgba(199,151,63,0.06);
  border: 2px solid var(--brass);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
  transition: all 0.15s ease;
  align-self: center;
  position: relative;
  z-index: 1;
}

.cert-columns {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 4px;
  padding: 2px 0;
  position: relative;
  z-index: 1;
}

.cert-col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 2px;
  padding: 2px 4px;
  box-sizing: border-box;
}

.cert-col:not(:last-child) {
  border-right: 1px dashed rgba(199,151,63,0.3);
  padding-right: 6px;
}

.cert-pill {
  box-sizing: border-box;
  border-radius: 4px;
  border: 1px solid rgba(58,106,154,0.25);
  border-left: 3px solid #3a6a9a;
  background: rgba(58,106,154,0.08);
  color: var(--ink);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 0 4px;
  width: 100%;
  min-height: 12px;
  transition: all 0.15s ease;
}

.cert-pill.wrap {
  white-space: normal;
  word-break: break-word;
  text-overflow: clip;
  line-height: 1.1;
  padding: 0 4px;
}

.cert-pill.female {
  background: rgba(185,116,98,0.08);
  border-color: rgba(185,116,98,0.25);
  border-left-color: #9a5a6a;
}

.cert-pill.indefinido {
  color: var(--ink-soft);
  font-style: italic;
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.08);
  border-left-color: rgba(0,0,0,0.15);
  font-weight: 400;
}

.subject-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  color: #20170a;
  flex-shrink: 0;
  transition: all 0.15s ease;
}

.subject-avatar.female { background: radial-gradient(circle at 35% 30%, #d4a098, #b97462 65%, #7c3b2c 100%) !important; }
.subject-avatar.male { background: radial-gradient(circle at 35% 30%, #b8cfe0, #3a6a9a 65%, #1a3a6a 100%) !important; }

.subject-name {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}

.subject-line {
  font-size: 10.5px;
  text-align: left;
  margin-bottom: 1px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s ease;
}

.subject-line b {
  font-weight: 600;
}

.subject-line .mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
}

.cert-pill-anilha {
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-top: 1px;
  font-size: 9px;
}

.cert-col[data-depth="1"] .cert-pill-anilha { font-size: 9px; opacity: 0.85; }
.cert-col[data-depth="2"] .cert-pill-anilha { font-size: 8px; opacity: 0.8; }
.cert-col[data-depth="3"] .cert-pill-anilha { font-size: 7px; opacity: 0.75; }
.cert-col[data-depth="4"] .cert-pill-anilha { font-size: 6.5px; opacity: 0.7; }
.cert-col[data-depth="5"] .cert-pill-anilha { font-size: 6px; opacity: 0.65; }

.cert-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px 20px;
  border-top: 2px solid var(--brass);
  font-size: 10px;
  color: var(--ink-soft);
  background: rgba(199,151,63,0.06);
  position: relative;
  z-index: 1;
}

.btn-voltar {
  display: inline-block;
  margin-top: 20px;
  padding: 10px 24px;
  border-radius: 8px;
  background: rgba(199,151,63,0.12);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  text-decoration: none;
  font-weight: 600;
  transition: .15s ease;
}

.btn-voltar:hover {
  background: rgba(199,151,63,0.2);
}

/* ================================================================
   ===== BOTÕES DE ZOOM =====
   ================================================================ */
.zoom-controls {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 12px 0;
}

.zoom-controls button {
  padding: 8px 18px;
  border-radius: 8px;
  background: rgba(199,151,63,0.15);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: .15s ease;
  min-width: 44px;
  min-height: 44px;
}

.zoom-controls button:hover {
  background: rgba(199,151,63,0.25);
}

.zoom-controls .zoom-level {
  display: flex;
  align-items: center;
  font-size: 14px;
  color: var(--text-muted);
  min-width: 50px;
  justify-content: center;
}

/* ================================================================
   ===== RESPONSIVO - SOMENTE AJUSTES MOBILE =====
   ================================================================ */
@media (max-width: 768px) {
  body { padding: 10px; }
  
  .site-header {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px 12px;
  }
  .site-header .logo { justify-content: center; }
  .site-nav { text-align: center; }
  .site-nav a { font-size: 11px; padding: 4px 10px; }

  .cert-wrap {
    width: 100%;
    max-width: 100%;
    aspect-ratio: auto;
    min-height: 500px;
    border-radius: 8px;
  }

  .cert-header {
    padding: 4px 10px;
    gap: 4px;
  }
  .cert-title { font-size: 16px; }
  .cert-criador { font-size: 10px; }
  .cert-responsavel { font-size: 8px; }
  .cert-registros { font-size: 7.5px; }
  .cert-contato { font-size: 7.5px; }

  .cert-body {
    padding: 6px 8px;
    flex-direction: column;
    gap: 6px;
  }

  .cert-subject-panel {
    flex: 0 0 auto;
    width: 100%;
    min-height: 80px;
    height: auto;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 6px 10px;
    gap: 6px;
    justify-content: flex-start;
    align-items: center;
  }
  .subject-avatar {
    width: 36px;
    height: 36px;
    font-size: 16px;
    margin: 0;
  }
  .subject-name {
    font-size: 13px;
    white-space: nowrap;
  }
  .subject-line {
    font-size: 8.5px;
    white-space: nowrap;
  }

  .cert-columns {
    min-height: 120px;
    gap: 2px;
  }
  .cert-col { padding: 1px 3px; gap: 1px; }
  .cert-col:not(:last-child) { padding-right: 3px; }
  .cert-pill {
    font-size: 7px;
    min-height: 12px;
    padding: 0 2px;
    border-left-width: 2px;
  }
  .cert-pill-anilha {
    font-size: 6px !important;
  }
  .cert-footer {
    padding: 4px 10px;
    font-size: 7.5px;
  }

  .zoom-controls button {
    min-width: 36px;
    min-height: 36px;
    font-size: 13px;
    padding: 4px 12px;
  }
  .zoom-controls .zoom-level {
    font-size: 12px;
    min-width: 40px;
  }

  .dica-zoom {
    display: block !important;
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    padding: 4px 0 8px;
    opacity: 0.6;
  }
}

@media (max-width: 400px) {
  .cert-subject-panel { min-height: 60px; }
  .subject-avatar { width: 28px; height: 28px; font-size: 12px; }
  .subject-name { font-size: 10px; }
  .subject-line { font-size: 7px; }
  .cert-pill { font-size: 6px; min-height: 10px; }
  .cert-pill-anilha { font-size: 5px !important; }
  .cert-title { font-size: 13px; }
  .cert-criador { font-size: 9px; }
}

.dica-zoom {
  display: none;
}

/* ===== IMPRESSÃO ===== */
@media print {
  .site-header, .btn-voltar, .zoom-controls, .dica-zoom, .cert-loading { display: none !important; }
  .cert-wrap {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 297mm !important;
    max-width: 297mm !important;
    height: 210mm !important;
    aspect-ratio: auto !important;
    opacity: 1 !important;
  }
  body { background: white !important; padding: 0 !important; }
  @page { size: landscape; margin: 0; }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="logo" id="logo-section">
      <!-- Preenchido pelo JavaScript -->
    </div>
    <nav class="site-nav">
      <a href="site-home.html">← Voltar ao Site</a>
    </nav>
  </header>

  <div class="cert-container">
    <!-- LOADING -->
    <div class="cert-loading" id="cert-loading">
      <div class="spinner"></div>
      <span>Carregando certificado...</span>
    </div>

    <!-- Dica de zoom para celular -->
    <div class="dica-zoom">🔍 Use os botões de zoom para ampliar</div>

    <!-- Controles de Zoom -->
    <div class="zoom-controls">
      <button onclick="zoomOut()">🔍−</button>
      <span class="zoom-level" id="zoom-level">100%</span>
      <button onclick="zoomIn()">🔍+</button>
      <button onclick="resetZoom()" style="font-size:12px;">↺ Reset</button>
    </div>

    <!-- CERTIFICADO ORIGINAL -->
    <div class="cert-wrap" id="cert-wrap">
      <div class="cert-bg-color" id="cert-bg-color" style="background:#f3ecda;"></div>
      <img class="cert-bg-image" id="cert-bg-image" style="display:none;" alt="Fundo">
      
      <div class="cert-header" id="cert-header">
        <div class="cert-header-left">
          <div class="cert-title" id="cert-title">CERTIFICADO</div>
          <div class="cert-criador" id="cert-criador">Criatório Goularth</div>
          <div class="cert-responsavel" id="cert-responsavel">Responsável: Fabio Alves Goulart</div>
          <div class="cert-registros" id="cert-registros">CTF 3348370 / FOB II.889</div>
          <div class="cert-contato" id="cert-contato">criatorio.goularth@gmail.com · (11) 9 4149-3657</div>
        </div>
      </div>
      
      <div class="cert-body">
        <div class="cert-subject-panel" id="cert-subject-panel"></div>
        <div class="cert-columns" id="cert-columns"></div>
      </div>
      
      <div class="cert-footer" id="cert-footer">
        <span id="cert-footer-text">Gestão de Criatório Goularth</span>
      </div>

    <div style="text-align:center;">
      <a href="site-plantel.html" class="btn-voltar">← Voltar</a>

  <script src="db-api.js"></script>
  <script>
    // ===== ZOOM =====
    let currentZoom = 1;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.15;

    function updateZoom() {
      const wrap = document.getElementById('cert-wrap');
      if (wrap) {
        const isMobile = window.innerWidth <= 768;
        const baseZoom = isMobile ? 0.75 : 1;
        const totalZoom = baseZoom * currentZoom;
        wrap.style.transform = `scale(${totalZoom})`;
        wrap.style.transformOrigin = 'top center';
      }
      document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
    }

    function zoomIn() {
      currentZoom = Math.min(currentZoom + ZOOM_STEP, MAX_ZOOM);
      updateZoom();
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - ZOOM_STEP, MIN_ZOOM);
      updateZoom();
    }

    function resetZoom() {
      currentZoom = 1;
      updateZoom();
    }

    // ===== TODO O JAVASCRIPT ORIGINAL =====
    async function getPersonalizacao() {
      return (await DB.getConfig('site_personalizacao')) || {};
    }

    async function carregarLogo() {
      const personalizacao = await getPersonalizacao();
      const logoSection = document.getElementById('logo-section');
      
      const nome = personalizacao.nome || 'Criatório Goularth';
      const subtitulo = personalizacao.subtitulo || '';
      const iniciais = personalizacao.logoIniciais || 'CG';
      const logoUrl = personalizacao.logoUrl || '';
      const logoTamanho = personalizacao.logoTamanho || 38;
      const nomeTamanho = personalizacao.nomeTamanho || 18;
      
      let logoHtml = '';
      if (logoUrl) {
        logoHtml = `<img src="${logoUrl}" style="width:${logoTamanho}px;height:${logoTamanho}px;border-radius:50%;border:2px solid var(--brass);object-fit:cover;" onerror="this.parentElement.innerHTML='<div class=\\'mark\\' style=\\'width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;\\'>${iniciais}</div>'">`;
      } else {
        logoHtml = `<div class="mark" style="width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;">${iniciais}</div>`;
      }
      
      logoSection.innerHTML = `
        ${logoHtml}
        <div>
          <div class="name" style="font-size:${nomeTamanho}px;">${nome}</div>
          ${subtitulo ? `<div class="sub" style="font-size:10px;">${subtitulo}</div>` : ''}
        </div>
      `;
    }

    async function getCertConfig() {
      try {
        const config = await DB.getConfig('cert_config');
        if (config) {
          return {
            bgColor: config.bgColor || '#f3ecda',
            bgImage: config.bgImage || null,
            bgOpacidade: config.bgOpacidade || 100,
            bgBrilho: config.bgBrilho || 100,
            corTitulo: config.corTitulo || '#c7973f',
            corCriador: config.corCriador || '#23291f',
            corResponsavel: config.corResponsavel || '#4a5347',
            corRegistros: config.corRegistros || '#4a5347',
            corContato: config.corContato || '#4a5347',
            corLinhaHeader: config.corLinhaHeader || '#c7973f',
            corMachoFundo: config.corMachoFundo || '#1a2e28',
            corMachoTexto: config.corMachoTexto || '#ece6d6',
            corFemeaFundo: config.corFemeaFundo || '#2e1a1a',
            corFemeaTexto: config.corFemeaTexto || '#ece6d6',
            corRaizFundo: config.corRaizFundo || '#132621',
            corRaizOpacidade: config.corRaizOpacidade || 100,
            corRaizTexto: config.corRaizTexto || '#e4c583',
            corBordaNos: config.corBordaNos || '#c7973f',
            corAvatarFundo: config.corAvatarFundo || '#c7973f',
            corAvatarTexto: config.corAvatarTexto || '#20170a',
            corBordaRaiz: config.corBordaRaiz || '#c7973f',
            corSexo: config.corSexo || '#4a5347',
            corAnilhaLabel: config.corAnilhaLabel || '#4a5347',
            corEspecie: config.corEspecie || '#4a5347',
            corNasc: config.corNasc || '#4a5347',
            corRaca: config.corRaca || '#4a5347',
            corAnilha: config.corAnilha || '#e4c583',
            corRodapeTexto: config.corRodapeTexto || '#4a5347',
            corRodapeLinha: config.corRodapeLinha || '#c7973f',
            corRodapeFundo: config.corRodapeFundo || 'rgba(199,151,63,0.06)',
            larguraRaiz: config.larguraRaiz || 86,
            alturaRaiz: config.alturaRaiz || 180,
            tamNome: config.tamNome || 15,
            tamInfo: config.tamInfo || 10.5,
            tamAvatar: config.tamAvatar || 46,
            negritoNome: config.negritoNome || 'bold',
            fonteCertificado: config.fonteCertificado || "'Manrope', sans-serif"
          };
        }
      } catch (e) {}
      return getConfigPadrao();
    }

    function getConfigPadrao() {
      return {
        bgColor: '#f3ecda',
        bgImage: null,
        bgOpacidade: 100,
        bgBrilho: 100,
        corTitulo: '#c7973f',
        corCriador: '#23291f',
        corResponsavel: '#4a5347',
        corRegistros: '#4a5347',
        corContato: '#4a5347',
        corLinhaHeader: '#c7973f',
        corMachoFundo: '#1a2e28',
        corMachoTexto: '#ece6d6',
        corFemeaFundo: '#2e1a1a',
        corFemeaTexto: '#ece6d6',
        corRaizFundo: '#132621',
        corRaizOpacidade: 100,
        corRaizTexto: '#e4c583',
        corBordaNos: '#c7973f',
        corAvatarFundo: '#c7973f',
        corAvatarTexto: '#20170a',
        corBordaRaiz: '#c7973f',
        corSexo: '#4a5347',
        corAnilhaLabel: '#4a5347',
        corEspecie: '#4a5347',
        corNasc: '#4a5347',
        corRaca: '#4a5347',
        corAnilha: '#e4c583',
        corRodapeTexto: '#4a5347',
        corRodapeLinha: '#c7973f',
        corRodapeFundo: 'rgba(199,151,63,0.06)',
        larguraRaiz: 86,
        alturaRaiz: 180,
        tamNome: 15,
        tamInfo: 10.5,
        tamAvatar: 46,
        negritoNome: 'bold',
        fonteCertificado: "'Manrope', sans-serif"
      };
    }

    async function getAveCompleta(id) {
      return DB.getCertificadoPublico(id);
    }

    function formatarData(data) {
      if (!data) return '-';
      const partes = String(data).slice(0, 10).split('-');
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }
      return data;
    }

    function getSexoLabel(sexo) {
      if (sexo === 'M') return 'Macho';
      if (sexo === 'F') return 'Fêmea';
      return 'Indefinido';
    }

    const CERT_CONFIG_GEN = {
      1: { minPill: 18, maxPill: 32, minFont: 8, maxFont: 14, colWidth: 1.8 },
      2: { minPill: 16, maxPill: 28, minFont: 7, maxFont: 12, colWidth: 1.5 },
      3: { minPill: 14, maxPill: 24, minFont: 6, maxFont: 10, colWidth: 1.3 },
      4: { minPill: 12, maxPill: 20, minFont: 5, maxFont: 8.5, colWidth: 1.1 },
      5: { minPill: 10, maxPill: 17, minFont: 4.5, maxFont: 7.5, colWidth: 0.95 }
    };

    function geracaoPaths(depth) {
      let paths = [''];
      for (let i = 0; i < depth; i++) {
        const next = [];
        paths.forEach(p => {
          next.push(p ? p + '.pai' : 'pai');
          next.push(p ? p + '.mae' : 'mae');
        });
        paths = next;
      }
      return paths;
    }

    function hexAlpha(pct) {
      const v = Math.round((Math.max(0, Math.min(100, pct)) / 100) * 255);
      return v.toString(16).padStart(2, '0');
    }

    async function carregarCertificado() {
      const loading = document.getElementById('cert-loading');
      const wrap = document.getElementById('cert-wrap');
      
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      
      if (!id) {
        document.getElementById('cert-subject-panel').innerHTML = '<div class="subject-name">Ave não encontrada</div>';
        loading.style.display = 'none';
        wrap.classList.add('loaded');
        return;
      }
      
      const ave = await getAveCompleta(id);
      
      if (!ave) {
        document.getElementById('cert-subject-panel').innerHTML = '<div class="subject-name">Ave não encontrada</div>';
        loading.style.display = 'none';
        wrap.classList.add('loaded');
        return;
      }

      const config = await getCertConfig();

      const tree = {};
      tree[''] = { nome: ave.nome, anilha: ave.anilha || '-' };
      
      if (ave.pai && ave.pai !== ave.nome) {
        if (ave.paiEncontrado) {
          tree['pai'] = { nome: ave.paiEncontrado.nome, anilha: ave.paiEncontrado.anilha || '' };
          if (ave.paiEncontrado.pai && ave.paiEncontrado.pai !== ave.paiEncontrado.nome) {
            tree['pai.pai'] = { nome: ave.paiEncontrado.pai, anilha: ave.paiEncontrado.anilhaPai || '' };
          }
          if (ave.paiEncontrado.mae && ave.paiEncontrado.mae !== ave.paiEncontrado.nome) {
            tree['pai.mae'] = { nome: ave.paiEncontrado.mae, anilha: ave.paiEncontrado.anilhaMae || '' };
          }
        } else {
          tree['pai'] = { nome: ave.pai, anilha: ave.anilhaPai || '' };
        }
      }
      
      if (ave.mae && ave.mae !== ave.nome) {
        if (ave.maeEncontrada) {
          tree['mae'] = { nome: ave.maeEncontrada.nome, anilha: ave.maeEncontrada.anilha || '' };
          if (ave.maeEncontrada.pai && ave.maeEncontrada.pai !== ave.maeEncontrada.nome) {
            tree['mae.pai'] = { nome: ave.maeEncontrada.pai, anilha: ave.maeEncontrada.anilhaPai || '' };
          }
          if (ave.maeEncontrada.mae && ave.maeEncontrada.mae !== ave.maeEncontrada.nome) {
            tree['mae.mae'] = { nome: ave.maeEncontrada.mae, anilha: ave.maeEncontrada.anilhaMae || '' };
          }
        } else {
          tree['mae'] = { nome: ave.mae, anilha: ave.anilhaMae || '' };
        }
      }
      
      if (ave.avoPaterno && !tree['pai.pai']) {
        tree['pai.pai'] = { nome: ave.avoPaterno, anilha: ave.anilhaAvoPaterno || '' };
      }
      if (ave.avoPaterna && !tree['pai.mae']) {
        tree['pai.mae'] = { nome: ave.avoPaterna, anilha: ave.anilhaAvoPaterna || '' };
      }
      if (ave.avoMaterno && !tree['mae.pai']) {
        tree['mae.pai'] = { nome: ave.avoMaterno, anilha: ave.anilhaAvoMaterno || '' };
      }
      if (ave.avoMaterna && !tree['mae.mae']) {
        tree['mae.mae'] = { nome: ave.avoMaterna, anilha: ave.anilhaAvoMaterna || '' };
      }

      if (Array.isArray(ave.ancestrais)) {
        ave.ancestrais.forEach(a => {
          if (a && a.caminho && a.nome && !tree[a.caminho]) {
            tree[a.caminho] = { nome: a.nome, anilha: a.anilha || '' };
          }
        });
      }

      function obterAncestral(caminho) {
        const encontrado = tree[caminho];
        return (encontrado && encontrado.nome) ? encontrado.nome : null;
      }

      function obterAnilha(caminho) {
        const encontrado = tree[caminho];
        return (encontrado && encontrado.anilha) ? encontrado.anilha : null;
      }

      // Cores e estilos - código original
      const bgColor = document.getElementById('cert-bg-color');
      const bgImage = document.getElementById('cert-bg-image');
      
      if (config.bgImage) {
        bgColor.style.background = 'transparent';
        bgImage.src = config.bgImage;
        bgImage.style.display = 'block';
        bgImage.style.opacity = (config.bgOpacidade || 100) / 100;
        bgImage.style.filter = `brightness(${(config.bgBrilho || 100) / 100})`;
      } else {
        bgColor.style.background = config.bgColor || '#f3ecda';
        bgImage.style.display = 'none';
        bgImage.style.opacity = 1;
        bgImage.style.filter = 'none';
      }

      const certWrap = document.getElementById('cert-wrap');
      if (certWrap) {
        certWrap.style.fontFamily = config.fonteCertificado || "'Manrope', sans-serif";
      }

      const header = document.getElementById('cert-header');
      if (header) {
        header.style.borderBottomColor = config.corLinhaHeader || '#c7973f';
        header.style.background = (config.corLinhaHeader || '#c7973f') + '11';
      }
      
      document.getElementById('cert-title').style.color = config.corTitulo || '#c7973f';
      document.getElementById('cert-criador').style.color = config.corCriador || '#23291f';
      document.getElementById('cert-responsavel').style.color = config.corResponsavel || '#4a5347';
      document.getElementById('cert-registros').style.color = config.corRegistros || '#4a5347';
      document.getElementById('cert-contato').style.color = config.corContato || '#4a5347';

      const footer = document.getElementById('cert-footer');
      if (footer) {
        footer.style.borderTopColor = config.corRodapeLinha || '#c7973f';
        footer.style.background = config.corRodapeFundo || 'rgba(199,151,63,0.06)';
      }
      document.getElementById('cert-footer-text').style.color = config.corRodapeTexto || '#4a5347';

      const classeAvatar = ave.sexo === 'M' ? 'male' : (ave.sexo === 'F' ? 'female' : '');
      const corAvatarPorSexo = ave.sexo === 'M' ? (config.corMachoFundo || '#1a2e28')
        : ave.sexo === 'F' ? (config.corFemeaFundo || '#2e1a1a')
        : (config.corAvatarFundo || '#c7973f');
      const avatarBg = `radial-gradient(circle at 35% 30%, ${corAvatarPorSexo}dd, ${corAvatarPorSexo} 60%, ${corAvatarPorSexo}aa)`;
      
      // ===== CORREÇÃO 1: LEGENDAS BRANCAS =====
      let linhasHtml = `
        <div class="subject-line" style="color:#ffffff !important;"><b style="color:#ffffff !important;">Sexo:</b> <span style="color:#ffffff !important;">${getSexoLabel(ave.sexo)}</span></div>
        <div class="subject-line mono" style="color:#ffffff !important;"><b style="color:#ffffff !important;">Anilha:</b> <span style="color:#ffffff !important;">${ave.anilha}</span></div>
        <div class="subject-line" style="color:#ffffff !important;"><b style="color:#ffffff !important;">Espécie:</b> <span style="color:#ffffff !important;">${ave.especie}</span></div>
        <div class="subject-line" style="color:#ffffff !important;"><b style="color:#ffffff !important;">Nasc.:</b> <span style="color:#ffffff !important;">${formatarData(ave.dataNasc)}</span></div>
      `;
      
      if (ave.raca && ave.raca.trim() !== '') {
        linhasHtml += `<div class="subject-line" style="color:#ffffff !important;">${ave.raca}</div>`;
      }
      
      const painel = document.getElementById('cert-subject-panel');
      painel.innerHTML = `
        <div class="subject-avatar ${classeAvatar}" style="background:${avatarBg};color:${config.corAvatarTexto || '#20170a'};width:${config.tamAvatar || 46}px;height:${config.tamAvatar || 46}px;font-size:${Math.round((config.tamAvatar || 46) * 0.4)}px;">${ave.sexo === 'M' ? '♂' : ave.sexo === 'F' ? '♀' : '⚪'}</div>
        <div style="flex:1;min-width:0;">
          <div class="subject-name" style="color:${config.corRaizTexto || '#e4c583'};font-size:${config.tamNome || 15}px;font-weight:${config.negritoNome || 'bold'};">${ave.nome}</div>
          ${linhasHtml}
        </div>
      `;

      painel.style.background = (config.corRaizFundo || '#132621') + hexAlpha(config.corRaizOpacidade || 100);
      painel.style.borderColor = config.corBordaRaiz || '#c7973f';
      painel.style.color = config.corRaizTexto || '#e4c583';

      // ===== CORREÇÃO 2: ANILHA BRANCA FORA DA PÍLULA =====
      let htmlColunas = '';
      for (let profundidade = 1; profundidade <= 5; profundidade++) {
        const caminhos = geracaoPaths(profundidade);
        const configPill = CERT_CONFIG_GEN[profundidade] || CERT_CONFIG_GEN[5];
        
        htmlColunas += `
          <div class="cert-col" 
               data-depth="${profundidade}" 
               data-count="${caminhos.length}" 
               style="flex: ${configPill.colWidth} 1 0; min-width: 50px;">
        `;
        
        caminhos.forEach(caminho => {
          const nome = obterAncestral(caminho);
          const anilha = obterAnilha(caminho);
          const isIndefinido = !nome || nome === 'Indefinido';
          const sexo = caminho.endsWith('pai') ? 'M' : 'F';
          const classeWrap = profundidade <= 2 ? ' wrap' : '';
          const classePilula = 'cert-pill' + classeWrap + (sexo === 'F' ? ' female' : '') + (isIndefinido ? ' indefinido' : '');
          
          if (isIndefinido) {
            htmlColunas += `<div class="${classePilula}" title="Indefinido">Indefinido</div>`;
          } else {
            htmlColunas += `
              <div class="cert-pill-wrapper">
                <div class="${classePilula}" title="${nome}" style="width:100%;">${nome}</div>
                ${anilha ? `<div class="cert-pill-anilha" style="color:#ffffff !important;">${anilha}</div>` : ''}
              </div>
            `;
          }
        });
        
        htmlColunas += `</div>`;
      }

      document.getElementById('cert-columns').innerHTML = htmlColunas;

      document.querySelectorAll('.cert-pill:not(.indefinido)').forEach(pilula => {
        const isFemale = pilula.classList.contains('female');
        if (isFemale) {
          pilula.style.background = config.corFemeaFundo || '#2e1a1a';
          pilula.style.color = config.corFemeaTexto || '#ece6d6';
          pilula.style.borderColor = (config.corFemeaFundo || '#2e1a1a') + '66';
          pilula.style.borderLeftColor = config.corFemeaFundo || '#2e1a1a';
        } else {
          pilula.style.background = config.corMachoFundo || '#1a2e28';
          pilula.style.color = config.corMachoTexto || '#ece6d6';
          pilula.style.borderColor = (config.corMachoFundo || '#1a2e28') + '66';
          pilula.style.borderLeftColor = config.corMachoFundo || '#1a2e28';
        }
        pilula.style.border = `1px solid ${(config.corBordaNos || '#c7973f')}66`;
        if (isFemale) {
          pilula.style.borderLeftColor = config.corFemeaFundo || '#2e1a1a';
        } else {
          pilula.style.borderLeftColor = config.corMachoFundo || '#1a2e28';
        }
      });

      // Esconde loading e mostra certificado
      loading.style.display = 'none';
      wrap.classList.add('loaded');

      // Ajusta as pílulas
      requestAnimationFrame(() => {
        ajustarPilulas();
        updateZoom();
      });
    }

    function ajustarPilulas() {
      const cols = document.querySelectorAll('#cert-columns .cert-col');
      const container = document.getElementById('cert-columns');
      if (!container || cols.length === 0) return;

      const alturaDisponivel = container.clientHeight || 400;
      
      cols.forEach(col => {
        const depth = parseInt(col.dataset.depth, 10);
        const count = parseInt(col.dataset.count, 10);
        if (!count) return;

        const config = CERT_CONFIG_GEN[depth] || CERT_CONFIG_GEN[5];

        const espacamento = 2;
        const alturaPilula = Math.max(
          config.minPill,
          Math.min(config.maxPill, (alturaDisponivel / count) - espacamento)
        );

        const proporcao = (alturaPilula - config.minPill) / (config.maxPill - config.minPill);
        const tamanhoFonte = Math.max(
          config.minFont,
          Math.min(config.maxFont, config.minFont + (config.maxFont - config.minFont) * proporcao)
        );

        col.querySelectorAll('.cert-pill').forEach(pilula => {
          pilula.style.height = alturaPilula + 'px';
          pilula.style.fontSize = tamanhoFonte + 'px';
          pilula.style.padding = '0 6px';
          if (depth <= 2) {
            pilula.style.whiteSpace = 'normal';
            pilula.style.wordBreak = 'break-word';
            pilula.style.lineHeight = '1.2';
          } else {
            pilula.style.whiteSpace = 'nowrap';
            pilula.style.lineHeight = alturaPilula + 'px';
          }
        });
      });
    }

    // Inicialização
    carregarLogo();
    carregarCertificado();

    let timeout;
    window.addEventListener('resize', function() {
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        ajustarPilulas();
        updateZoom();
      }, 300);
    });

    setTimeout(updateZoom, 300);
  </script>
  <script src="site-buttons.js"></script>
</body>
</html>
