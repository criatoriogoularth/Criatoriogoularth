<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Criatório Goularth — Certificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1a16;
  --bg-elevated: #132621;
  --bg-elevated-2: #17302a;
  --parchment: #f3ecda;
  --parchment-dim: #e7dec5;
  --ink: #23291f;
  --ink-soft: #4a5347;
  --brass: #c7973f;
  --brass-soft: #e4c583;
  --brass-dim: rgba(199,151,63,0.28);
  --text: #ece6d6;
  --text-muted: #9aa89e;
  --line: rgba(199,151,63,0.22);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  padding: 10px;
}

.site-header {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.site-header .logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.site-header .logo .mark {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--brass-soft);
  background: rgba(199,151,63,0.08);
  flex-shrink: 0;
  object-fit: cover;
}
.site-header .logo .mark img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.site-header .logo .name {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--brass-soft);
}
.site-header .logo .sub { font-size: 9px; color: var(--text-muted); display: block; }
.site-nav a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  transition: .15s ease;
  border: 1px solid transparent;
}
.site-nav a:hover {
  color: var(--text);
  background: rgba(199,151,63,0.08);
  border-color: var(--brass-dim);
}

/* ===== CONTAINER DO CERTIFICADO - COM SCROLL E ZOOM ===== */
.cert-container {
  max-width: 100%;
  margin: 0 auto;
  padding: 0 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/* ===== CERTIFICADO - TAMANHO FIXO PARA ZOOM ===== */
.cert-wrap {
  background: var(--parchment);
  color: var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  font-family: 'Manrope', sans-serif;
  display: flex;
  flex-direction: column;
  position: relative;
  min-height: 400px;
  /* Permite zoom no mobile */
  transform: scale(1);
  transform-origin: top left;
}

/* Versão desktop - tamanho normal */
@media (min-width: 769px) {
  .cert-wrap {
    aspect-ratio: 297 / 210;
    min-height: 500px;
  }
}

/* Versão mobile - tamanho adaptado com scroll */
@media (max-width: 768px) {
  .cert-wrap {
    width: 100%;
    min-width: 320px;
    aspect-ratio: auto;
    min-height: 450px;
    border-radius: 8px;
  }
}

.cert-bg-color {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: #f3ecda;
}
.cert-bg-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
  opacity: 0.3;
  display: none;
}

/* ===== HEADER ===== */
.cert-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 2px solid var(--brass);
  background: rgba(199,151,63,0.08);
  flex: 0 0 auto;
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
}
.cert-header-left { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.cert-title {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--brass);
}
.cert-criador {
  font-weight: 700;
  font-size: 12px;
  color: var(--ink);
  margin-top: 1px;
}
.cert-responsavel {
  font-size: 9.5px;
  color: var(--ink-soft);
  margin-top: 1px;
}
.cert-registros {
  font-size: 8.5px;
  color: var(--ink-soft);
  margin-top: 1px;
}
.cert-contato {
  font-size: 8.5px;
  color: var(--ink-soft);
  margin-top: 1px;
}

/* ===== BODY ===== */
.cert-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 10px 14px;
  display: flex;
  flex-direction: row;
  gap: 12px;
  position: relative;
  z-index: 1;
}

/* Painel da Ave (Raiz) */
.cert-subject-panel {
  flex: 0 0 160px;
  min-height: 160px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: rgba(199,151,63,0.06);
  border: 2px solid var(--brass);
  border-radius: 10px;
  padding: 10px 12px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.subject-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  margin: 0 auto 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  color: #20170a;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.subject-avatar.female { background: radial-gradient(circle at 35% 30%, #d4a098, #b97462 65%, #7c3b2c 100%) !important; }
.subject-avatar.male { background: radial-gradient(circle at 35% 30%, #b8cfe0, #3a6a9a 65%, #1a3a6a 100%) !important; }

.subject-name {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.subject-line {
  font-size: 10px;
  color: var(--ink);
  text-align: left;
  margin-bottom: 1px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.subject-line b { color: var(--ink-soft); font-weight: 600; }
.subject-line .mono { font-family: 'JetBrains Mono', monospace; font-size: 9px; }

/* ===== COLUNAS DA ÁRVORE ===== */
.cert-columns {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 4px;
  padding: 2px 0;
  position: relative;
  z-index: 1;
}

.cert-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 2px;
  padding: 2px 4px;
  box-sizing: border-box;
  flex: 1;
  min-width: 0;
}
.cert-col:not(:last-child) {
  border-right: 1px dashed rgba(199,151,63,0.3);
  padding-right: 6px;
}

.cert-pill {
  box-sizing: border-box;
  border-radius: 4px;
  border: 1px solid rgba(58,106,154,0.25);
  border-left: 3px solid #3a6a9a;
  background: rgba(58,106,154,0.08);
  color: var(--ink);
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 2px 4px;
  width: 100%;
  min-height: 20px;
  font-size: 9px;
  transition: all 0.15s ease;
  line-height: 1.2;
  word-break: break-word;
}
.cert-pill.wrap { white-space: normal; word-break: break-word; line-height: 1.1; }
.cert-pill.female {
  background: rgba(185,116,98,0.08);
  border-color: rgba(185,116,98,0.25);
  border-left-color: #9a5a6a;
}
.cert-pill.indefinido {
  color: var(--ink-soft);
  font-style: italic;
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.08);
  border-left-color: rgba(0,0,0,0.15);
  font-weight: 400;
}
.cert-pill-anilha {
  font-family: 'JetBrains Mono', monospace;
  color: #1a1a1a !important;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: 0.02em;
  font-size: 7.5px;
  margin-top: 1px;
}

/* ===== FOOTER ===== */
.cert-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px 16px;
  border-top: 2px solid var(--brass);
  font-size: 9px;
  color: var(--ink-soft);
  background: rgba(199,151,63,0.06);
  position: relative;
  z-index: 1;
}

/* ===== BOTÃO VOLTAR ===== */
.btn-voltar {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 8px;
  background: rgba(199,151,63,0.12);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  text-decoration: none;
  font-weight: 600;
  transition: .15s ease;
}
.btn-voltar:hover { background: rgba(199,151,63,0.2); }

/* ===== CONTROLE DE ZOOM ===== */
.zoom-controls {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0;
}
.zoom-controls button {
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(199,151,63,0.15);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: .15s ease;
  min-width: 48px;
  min-height: 48px;
}
.zoom-controls button:hover {
  background: rgba(199,151,63,0.25);
}
.zoom-controls .zoom-level {
  display: flex;
  align-items: center;
  font-size: 14px;
  color: var(--text-muted);
  min-width: 50px;
  justify-content: center;
}

/* ===== RESPONSIVO - MOBILE ===== */
@media (max-width: 768px) {
  body { padding: 6px; }
  .site-header {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px 12px;
  }
  .site-header .logo { justify-content: center; }
  .site-nav { text-align: center; }
  .site-nav a { font-size: 11px; padding: 4px 10px; }

  .cert-wrap {
    border-radius: 8px;
    min-height: 350px;
    min-width: 320px;
  }

  .cert-header {
    padding: 4px 10px;
    gap: 4px;
  }
  .cert-title { font-size: 16px; }
  .cert-criador { font-size: 10px; }
  .cert-responsavel { font-size: 8px; }
  .cert-registros { font-size: 7.5px; }
  .cert-contato { font-size: 7.5px; }

  .cert-body {
    padding: 6px 8px;
    flex-direction: column;
    gap: 6px;
  }

  .cert-subject-panel {
    flex: 0 0 auto;
    width: 100%;
    min-height: 80px;
    flex-direction: row;
    flex-wrap: wrap;
    padding: 6px 10px;
    gap: 6px;
    justify-content: flex-start;
  }
  .subject-avatar {
    width: 36px;
    height: 36px;
    font-size: 16px;
    margin: 0;
  }
  .subject-name {
    font-size: 13px;
    white-space: nowrap;
  }
  .subject-line {
    font-size: 8.5px;
    white-space: nowrap;
  }

  .cert-columns {
    min-height: 80px;
    gap: 2px;
  }
  .cert-col { padding: 1px 3px; gap: 1px; }
  .cert-col:not(:last-child) { padding-right: 3px; }
  .cert-pill {
    font-size: 7px;
    min-height: 14px;
    padding: 1px 2px;
    border-left-width: 2px;
  }
  .cert-pill-anilha { font-size: 6px; }
  .cert-footer {
    padding: 4px 10px;
    font-size: 7.5px;
  }

  .zoom-controls button {
    min-width: 40px;
    min-height: 40px;
    font-size: 14px;
  }
}

/* ===== IMPRESSÃO ===== */
@media print {
  .site-header, .btn-voltar, .zoom-controls { display: none !important; }
  .cert-wrap {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 100% !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    min-height: auto !important;
  }
  body { background: white !important; padding: 0 !important; }
  @page { size: landscape; margin: 0; }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="logo" id="logo-section">
      <!-- Preenchido pelo JavaScript -->
    </div>
    <nav class="site-nav">
      <a href="site-home.html">← Voltar ao Site</a>
    </nav>
  </header>

  <div class="cert-container" id="cert-container">
    <!-- Controles de Zoom -->
    <div class="zoom-controls">
      <button onclick="zoomOut()">🔍−</button>
      <span class="zoom-level" id="zoom-level">100%</span>
      <button onclick="zoomIn()">🔍+</button>
      <button onclick="resetZoom()" style="font-size:12px;">↺ Reset</button>
    </div>

    <div class="cert-wrap" id="cert-wrap" style="transform: scale(1); transform-origin: top left;">
      <div class="cert-bg-color" id="cert-bg-color" style="background:#f3ecda;"></div>
      <img class="cert-bg-image" id="cert-bg-image" style="display:none;" alt="Fundo">
      
      <div class="cert-header" id="cert-header">
        <div class="cert-header-left">
          <div class="cert-title" id="cert-title">CERTIFICADO</div>
          <div class="cert-criador" id="cert-criador">Criatório Goularth</div>
          <div class="cert-responsavel" id="cert-responsavel">Responsável: Fabio Alves Goulart</div>
          <div class="cert-registros" id="cert-registros">CTF 3348370 / FOB II.889</div>
          <div class="cert-contato" id="cert-contato">criatorio.goularth@gmail.com · (11) 9 4149-3657</div>
        </div>
      </div>
      
      <div class="cert-body">
        <div class="cert-subject-panel" id="cert-subject-panel"></div>
        <div class="cert-columns" id="cert-columns"></div>
      </div>
      
      <div class="cert-footer" id="cert-footer">
        <span id="cert-footer-text">Gestão de Criatório Goularth</span>
      </div>
    </div>
    
    <div style="text-align:center; margin-top:12px;">
      <a href="site-plantel.html" class="btn-voltar">← Voltar</a>
    </div>
  </div>

  <script src="db-api.js"></script>
  <script>
    // ===== ZOOM =====
    let currentZoom = 1;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.15;

    function updateZoom() {
      const wrap = document.getElementById('cert-wrap');
      if (wrap) {
        wrap.style.transform = `scale(${currentZoom})`;
        wrap.style.transformOrigin = 'top left';
      }
      document.getElementById('zoom-level').textContent = Math.round(currentZoom * 100) + '%';
    }

    function zoomIn() {
      currentZoom = Math.min(currentZoom + ZOOM_STEP, MAX_ZOOM);
      updateZoom();
    }

    function zoomOut() {
      currentZoom = Math.max(currentZoom - ZOOM_STEP, MIN_ZOOM);
      updateZoom();
    }

    function resetZoom() {
      currentZoom = 1;
      updateZoom();
    }

    // Gestos de pinça no mobile (touch)
    let lastTouchDistance = 0;
    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        lastTouchDistance = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
      }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (e.touches.length === 2) {
        const touch1 = e.touches[0];
        const touch2 = e.touches[1];
        const distance = Math.hypot(touch2.clientX - touch1.clientX, touch2.clientY - touch1.clientY);
        if (lastTouchDistance > 0) {
          const delta = (distance - lastTouchDistance) / 200;
          currentZoom = Math.min(Math.max(currentZoom + delta, MIN_ZOOM), MAX_ZOOM);
          updateZoom();
        }
        lastTouchDistance = distance;
      }
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      lastTouchDistance = 0;
    }, { passive: true });

    // ===== CARREGAR DADOS =====
    async function getPersonalizacao() {
      return (await DB.getConfig('site_personalizacao')) || {};
    }

    async function carregarLogo() {
      const personalizacao = await getPersonalizacao();
      const logoSection = document.getElementById('logo-section');
      
      const nome = personalizacao.nome || 'Criatório Goularth';
      const subtitulo = personalizacao.subtitulo || '';
      const iniciais = personalizacao.logoIniciais || 'CG';
      const logoUrl = personalizacao.logoUrl || '';
      const logoTamanho = personalizacao.logoTamanho || 38;
      const nomeTamanho = personalizacao.nomeTamanho || 18;
      
      let logoHtml = '';
      if (logoUrl) {
        logoHtml = `<img src="${logoUrl}" style="width:${logoTamanho}px;height:${logoTamanho}px;border-radius:50%;border:2px solid var(--brass);object-fit:cover;" onerror="this.parentElement.innerHTML='<div class=\\'mark\\' style=\\'width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;\\'>${iniciais}</div>'">`;
      } else {
        logoHtml = `<div class="mark" style="width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;">${iniciais}</div>`;
      }
      
      logoSection.innerHTML = `
        ${logoHtml}
        <div>
          <div class="name" style="font-size:${nomeTamanho}px;">${nome}</div>
          ${subtitulo ? `<div class="sub" style="font-size:10px;">${subtitulo}</div>` : ''}
        </div>
      `;
    }

    // ===== CONFIGURAÇÕES DO CERTIFICADO =====
    const CERT_MAX_GEN = 5;

    function geracaoPaths(depth) {
      let paths = [''];
      for (let i = 0; i < depth; i++) {
        const next = [];
        paths.forEach(p => {
          next.push(p ? p + '.pai' : 'pai');
          next.push(p ? p + '.mae' : 'mae');
        });
        paths = next;
      }
      return paths;
    }

    function formatarData(data) {
      if (!data) return '-';
      const partes = String(data).slice(0, 10).split('-');
      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }
      return data;
    }

    function getSexoLabel(sexo) {
      if (sexo === 'M') return 'Macho';
      if (sexo === 'F') return 'Fêmea';
      return 'Indefinido';
    }

    async function carregarCertificado() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id'));
      
      if (!id) {
        document.getElementById('cert-subject-panel').innerHTML = '<div class="subject-name">Ave não encontrada</div>';
        return;
      }
      
      try {
        const ave = await DB.getCertificadoPublico(id);
        
        if (!ave) {
          document.getElementById('cert-subject-panel').innerHTML = '<div class="subject-name">Ave não encontrada</div>';
          return;
        }

        const tree = {};
        tree[''] = { nome: ave.nome, anilha: ave.anilha || '-' };
        
        if (ave.pai && ave.pai !== ave.nome) {
          tree['pai'] = { nome: ave.pai, anilha: ave.anilhaPai || '' };
        }
        if (ave.mae && ave.mae !== ave.nome) {
          tree['mae'] = { nome: ave.mae, anilha: ave.anilhaMae || '' };
        }
        if (ave.avoPaterno) {
          tree['pai.pai'] = { nome: ave.avoPaterno, anilha: '' };
        }
        if (ave.avoPaterna) {
          tree['pai.mae'] = { nome: ave.avoPaterna, anilha: '' };
        }
        if (ave.avoMaterno) {
          tree['mae.pai'] = { nome: ave.avoMaterno, anilha: '' };
        }
        if (ave.avoMaterna) {
          tree['mae.mae'] = { nome: ave.avoMaterna, anilha: '' };
        }

        // Ancestrais mais profundos
        if (Array.isArray(ave.ancestrais)) {
          ave.ancestrais.forEach(a => {
            if (a && a.caminho && a.nome && !tree[a.caminho]) {
              tree[a.caminho] = { nome: a.nome, anilha: a.anilha || '' };
            }
          });
        }

        function obterAncestral(caminho) {
          const encontrado = tree[caminho];
          return (encontrado && encontrado.nome) ? encontrado.nome : null;
        }

        function obterAnilha(caminho) {
          const encontrado = tree[caminho];
          return (encontrado && encontrado.anilha) ? encontrado.anilha : null;
        }

        // Preenche o painel da ave
        const classeAvatar = ave.sexo === 'M' ? 'male' : (ave.sexo === 'F' ? 'female' : '');
        const avatarBg = ave.sexo === 'M' 
          ? 'radial-gradient(circle at 35% 30%, #b8cfe0, #3a6a9a 65%, #1a3a6a 100%)'
          : ave.sexo === 'F'
          ? 'radial-gradient(circle at 35% 30%, #d4a098, #b97462 65%, #7c3b2c 100%)'
          : 'radial-gradient(circle at 35% 30%, #d4d4d4, #888888 65%, #555555 100%)';
        
        document.getElementById('cert-subject-panel').innerHTML = `
          <div class="subject-avatar ${classeAvatar}" style="background:${avatarBg};">${ave.sexo === 'M' ? '♂' : ave.sexo === 'F' ? '♀' : '⚪'}</div>
          <div style="flex:1; min-width:0;">
            <div class="subject-name">${ave.nome}</div>
            <div class="subject-line"><b>Sexo:</b> ${getSexoLabel(ave.sexo)}</div>
            <div class="subject-line mono"><b>Anilha:</b> ${ave.anilha}</div>
            <div class="subject-line"><b>Espécie:</b> ${ave.especie || '-'}</div>
            <div class="subject-line"><b>Nasc.:</b> ${formatarData(ave.dataNasc)}</div>
            ${ave.raca ? `<div class="subject-line"><b>Raça:</b> ${ave.raca}</div>` : ''}
          </div>
        `;

        // Preenche a árvore
        let htmlColunas = '';
        for (let profundidade = 1; profundidade <= CERT_MAX_GEN; profundidade++) {
          const caminhos = geracaoPaths(profundidade);
          
          htmlColunas += `
            <div class="cert-col" data-depth="${profundidade}" data-count="${caminhos.length}">
          `;
          
          caminhos.forEach(caminho => {
            const nome = obterAncestral(caminho);
            const anilha = obterAnilha(caminho);
            const isIndefinido = !nome || nome === 'Indefinido';
            const sexo = caminho.endsWith('pai') ? 'M' : 'F';
            const classeWrap = profundidade <= 2 ? ' wrap' : '';
            const classePilula = 'cert-pill' + classeWrap + (sexo === 'F' ? ' female' : '') + (isIndefinido ? ' indefinido' : '');
            
            if (isIndefinido) {
              htmlColunas += `<div class="${classePilula}" title="Indefinido">Indefinido</div>`;
            } else {
              htmlColunas += `
                <div class="${classePilula}" title="${nome}">${nome}${anilha ? `<div class="cert-pill-anilha">${anilha}</div>` : ''}</div>
              `;
            }
          });
          
          htmlColunas += `</div>`;
        }

        document.getElementById('cert-columns').innerHTML = htmlColunas;

      } catch (error) {
        console.error('Erro ao carregar certificado:', error);
        document.getElementById('cert-subject-panel').innerHTML = `
          <div class="subject-name">Erro ao carregar</div>
          <div class="subject-line">${error.message}</div>
        `;
      }
    }

    carregarLogo();
    carregarCertificado();
  </script>
  <script src="site-buttons.js"></script>
</body>
</html>
