<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Criatório Goularth — Certificado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1a16;
  --bg-elevated: #132621;
  --bg-elevated-2: #17302a;
  --parchment: #f3ecda;
  --parchment-dim: #e7dec5;
  --ink: #23291f;
  --ink-soft: #4a5347;
  --brass: #c7973f;
  --brass-soft: #e4c583;
  --brass-dim: rgba(199,151,63,0.28);
  --text: #ece6d6;
  --text-muted: #9aa89e;
  --line: rgba(199,151,63,0.22);
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
  padding: 10px;
}

.site-header {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  border-radius: var(--radius);
  margin-bottom: 16px;
}

.site-header .logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.site-header .logo .mark {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--brass);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Fraunces', serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--brass-soft);
  background: rgba(199,151,63,0.08);
  flex-shrink: 0;
  object-fit: cover;
}
.site-header .logo .mark img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.site-header .logo .name {
  font-family: 'Fraunces', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--brass-soft);
}
.site-header .logo .sub { font-size: 9px; color: var(--text-muted); display: block; }
.site-nav a {
  color: var(--text-muted);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  transition: .15s ease;
  border: 1px solid transparent;
}
.site-nav a:hover {
  color: var(--text);
  background: rgba(199,151,63,0.08);
  border-color: var(--brass-dim);
}

/* ===== CONTAINER DO CERTIFICADO ===== */
.cert-container {
  max-width: 100%;
  margin: 0 auto;
  padding: 0 4px;
}

/* ===== CERTIFICADO RESPONSIVO ===== */
.cert-wrap {
  background: var(--parchment);
  color: var(--ink);
  border-radius: var(--radius);
  overflow: hidden;
  width: 100%;
  max-width: 100%;
  margin: 0 auto;
  box-shadow: 0 4px 30px rgba(0,0,0,0.3);
  font-family: 'Manrope', sans-serif;
  display: flex;
  flex-direction: column;
  position: relative;
  /* Altura automática em mobile */
  aspect-ratio: auto;
  min-height: 400px;
}

.cert-bg-color {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  background: #f3ecda;
}
.cert-bg-image {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
  opacity: 0.3;
  display: none;
}

/* ===== HEADER ===== */
.cert-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  padding: 6px 12px;
  border-bottom: 2px solid var(--brass);
  background: rgba(199,151,63,0.08);
  flex: 0 0 auto;
  position: relative;
  z-index: 1;
  flex-wrap: wrap;
}
.cert-header-left { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.cert-title {
  font-family: 'Fraunces', serif;
  font-size: clamp(14px, 3vw, 22px);
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--brass);
}
.cert-criador {
  font-weight: 700;
  font-size: clamp(9px, 1.8vw, 13px);
  color: var(--ink);
  margin-top: 1px;
}
.cert-responsavel {
  font-size: clamp(7px, 1.4vw, 10px);
  color: var(--ink-soft);
  margin-top: 1px;
}
.cert-registros {
  font-size: clamp(6.5px, 1.2vw, 9px);
  color: var(--ink-soft);
  margin-top: 1px;
}
.cert-contato {
  font-size: clamp(6.5px, 1.2vw, 9px);
  color: var(--ink-soft);
  margin-top: 1px;
}

/* ===== BODY ===== */
.cert-body {
  flex: 1 1 auto;
  min-height: 0;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
}

/* Painel da Ave (Raiz) */
.cert-subject-panel {
  flex: 0 0 auto;
  width: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 10px;
  background: rgba(199,151,63,0.06);
  border: 2px solid var(--brass);
  border-radius: 10px;
  padding: 8px 12px;
  text-align: left;
  position: relative;
  z-index: 1;
  min-height: 80px;
  flex-wrap: wrap;
}

.subject-avatar {
  width: clamp(36px, 8vw, 46px);
  height: clamp(36px, 8vw, 46px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(14px, 3.5vw, 19px);
  color: #20170a;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.subject-avatar.female { background: radial-gradient(circle at 35% 30%, #d4a098, #b97462 65%, #7c3b2c 100%) !important; }
.subject-avatar.male { background: radial-gradient(circle at 35% 30%, #b8cfe0, #3a6a9a 65%, #1a3a6a 100%) !important; }

.subject-info { flex: 1; min-width: 0; }
.subject-name {
  font-family: 'Fraunces', serif;
  font-size: clamp(13px, 3vw, 17px);
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subject-line {
  font-size: clamp(8px, 1.8vw, 10.5px);
  color: var(--ink);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.subject-line b { color: var(--ink-soft); font-weight: 600; }
.subject-line .mono { font-family: 'JetBrains Mono', monospace; font-size: clamp(7px, 1.5vw, 9.5px); }

/* ===== COLUNAS DA ÁRVORE ===== */
.cert-columns {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 3px;
  padding: 2px 0;
  position: relative;
  z-index: 1;
  min-height: 100px;
}

.cert-col {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  gap: 2px;
  padding: 2px 3px;
  box-sizing: border-box;
  min-width: 0;
}
.cert-col:not(:last-child) {
  border-right: 1px dashed rgba(199,151,63,0.3);
  padding-right: 4px;
}

.cert-pill {
  box-sizing: border-box;
  border-radius: 4px;
  border: 1px solid rgba(58,106,154,0.25);
  border-left: 3px solid #3a6a9a;
  background: rgba(58,106,154,0.08);
  color: var(--ink);
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
  padding: 0 3px;
  width: 100%;
  min-height: 10px;
  font-size: clamp(6px, 1.2vw, 9px);
  transition: all 0.15s ease;
  line-height: 1.1;
  word-break: break-word;
}
.cert-pill.wrap { white-space: normal; word-break: break-word; line-height: 1.1; padding: 0 3px; }
.cert-pill.female {
  background: rgba(185,116,98,0.08);
  border-color: rgba(185,116,98,0.25);
  border-left-color: #9a5a6a;
}
.cert-pill.indefinido {
  color: var(--ink-soft);
  font-style: italic;
  background: rgba(0,0,0,0.03);
  border-color: rgba(0,0,0,0.08);
  border-left-color: rgba(0,0,0,0.15);
  font-weight: 400;
}
.cert-pill-anilha {
  font-family: 'JetBrains Mono', monospace;
  color: #1a1a1a !important;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-top: 1px;
  font-size: clamp(5px, 1vw, 8px);
}

/* ===== FOOTER ===== */
.cert-footer {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px;
  padding: 6px 12px;
  border-top: 2px solid var(--brass);
  font-size: clamp(7px, 1.2vw, 10px);
  color: var(--ink-soft);
  background: rgba(199,151,63,0.06);
  position: relative;
  z-index: 1;
}

.btn-voltar {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 24px;
  border-radius: 8px;
  background: rgba(199,151,63,0.12);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  text-decoration: none;
  font-weight: 600;
  transition: .15s ease;
  font-size: clamp(12px, 2vw, 14px);
}
.btn-voltar:hover { background: rgba(199,151,63,0.2); }

/* ===== RESPONSIVO - MOBILE ===== */
@media (max-width: 768px) {
  body { padding: 6px; }
  .site-header {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px 12px;
  }
  .site-header .logo { justify-content: center; }
  .site-nav { text-align: center; }
  .site-nav a { font-size: 11px; padding: 4px 10px; }

  .cert-wrap {
    border-radius: 10px;
    min-height: 300px;
  }
  .cert-header {
    padding: 4px 10px;
    gap: 4px;
  }
  .cert-body {
    padding: 4px 6px;
    gap: 4px;
  }
  .cert-subject-panel {
    padding: 6px 10px;
    min-height: 60px;
    flex-wrap: nowrap;
    gap: 6px;
  }
  .subject-avatar {
    width: 32px;
    height: 32px;
    font-size: 14px;
  }
  .subject-name { font-size: 12px; }
  .subject-line { font-size: 8px; }

  /* Árvore em grid - mais compacta */
  .cert-columns {
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    min-height: 60px;
  }
  .cert-col { padding: 1px 2px; gap: 1px; }
  .cert-col:not(:last-child) { padding-right: 2px; }
  .cert-pill {
    font-size: 6px;
    min-height: 8px;
    padding: 0 2px;
    border-left-width: 2px;
  }
  .cert-pill-anilha { font-size: 5px; }
  .cert-footer {
    padding: 4px 10px;
    font-size: 7px;
  }
}

/* ===== TELAS MUITO PEQUENAS (até 400px) ===== */
@media (max-width: 400px) {
  .cert-subject-panel { flex-wrap: wrap; gap: 4px; min-height: 50px; }
  .subject-avatar { width: 28px; height: 28px; font-size: 12px; }
  .subject-name { font-size: 11px; }
  .subject-line { font-size: 7px; }
  .cert-columns { grid-template-columns: repeat(5, 1fr); gap: 1px; min-height: 40px; }
  .cert-pill { font-size: 5px; min-height: 6px; padding: 0 1px; border-left-width: 1.5px; }
  .cert-pill-anilha { font-size: 4px; }
  .cert-title { font-size: 12px; }
  .cert-criador { font-size: 8px; }
  .cert-responsavel { font-size: 6.5px; }
  .cert-registros { font-size: 6px; }
  .cert-contato { font-size: 6px; }
}

/* ===== IMPRESSÃO ===== */
@media print {
  .site-header, .btn-voltar { display: none !important; }
  .cert-wrap {
    box-shadow: none !important;
    border-radius: 0 !important;
    width: 100% !important;
    max-width: none !important;
    aspect-ratio: auto !important;
    min-height: auto !important;
  }
  body { background: white !important; padding: 0 !important; }
  @page { size: landscape; margin: 0; }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="logo" id="logo-section">
      <!-- Preenchido pelo JavaScript -->
    </div>
    <nav class="site-nav">
      <a href="site-home.html">← Voltar ao Site</a>
    </nav>
  </header>

  <div class="cert-container">
    <div class="cert-wrap" id="cert-wrap">
      <div class="cert-bg-color" id="cert-bg-color" style="background:#f3ecda;"></div>
      <img class="cert-bg-image" id="cert-bg-image" style="display:none;" alt="Fundo">
      
      <div class="cert-header" id="cert-header">
        <div class="cert-header-left">
          <div class="cert-title" id="cert-title">CERTIFICADO</div>
          <div class="cert-criador" id="cert-criador">Criatório Goularth</div>
          <div class="cert-responsavel" id="cert-responsavel">Responsável: Fabio Alves Goulart</div>
          <div class="cert-registros" id="cert-registros">CTF 3348370 / FOB II.889</div>
          <div class="cert-contato" id="cert-contato">criatorio.goularth@gmail.com · (11) 9 4149-3657</div>
        </div>
      </div>
      
      <div class="cert-body">
        <div class="cert-subject-panel" id="cert-subject-panel"></div>
        <div class="cert-columns" id="cert-columns"></div>
      </div>
      
      <div class="cert-footer" id="cert-footer">
        <span id="cert-footer-text">Gestão de Criatório Goularth</span>
      </div>
    </div>
    
    <div style="text-align:center;">
      <a href="site-plantel.html" class="btn-voltar">← Voltar</a>
    </div>
  </div>

  <script src="db-api.js"></script>
  <script>
    // Mesmo JavaScript do original - mantido
    async function getPersonalizacao() {
      return (await DB.getConfig('site_personalizacao')) || {};
    }

    async function carregarLogo() {
      const personalizacao = await getPersonalizacao();
      const logoSection = document.getElementById('logo-section');
      
      const nome = personalizacao.nome || 'Criatório Goularth';
      const subtitulo = personalizacao.subtitulo || '';
      const iniciais = personalizacao.logoIniciais || 'CG';
      const logoUrl = personalizacao.logoUrl || '';
      const logoTamanho = personalizacao.logoTamanho || 38;
      const nomeTamanho = personalizacao.nomeTamanho || 18;
      
      let logoHtml = '';
      if (logoUrl) {
        logoHtml = `<img src="${logoUrl}" style="width:${logoTamanho}px;height:${logoTamanho}px;border-radius:50%;border:2px solid var(--brass);object-fit:cover;" onerror="this.parentElement.innerHTML='<div class=\\'mark\\' style=\\'width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;\\'>${iniciais}</div>'">`;
      } else {
        logoHtml = `<div class="mark" style="width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;">${iniciais}</div>`;
      }
      
      logoSection.innerHTML = `
        ${logoHtml}
        <div>
          <div class="name" style="font-size:${nomeTamanho}px;">${nome}</div>
          ${subtitulo ? `<div class="sub" style="font-size:10px;">${subtitulo}</div>` : ''}
        </div>
      `;
    }

    // O resto do JavaScript permanece igual ao original...
    // (mantido por questões de espaço, mas você deve manter o original)
  </script>
  <script src="site-buttons.js"></script>
</body>
</html>
