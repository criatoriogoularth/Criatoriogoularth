<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviário — Editar Espécies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.editor-card {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.editor-card h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px;
  color: var(--brass-soft);
  margin-bottom: 14px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}
.field label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
}
.field input,
.field select,
.field textarea {
  background: rgba(0,0,0,0.35) !important;
  border: 1px solid var(--line) !important;
  border-radius: 6px !important;
  padding: 8px 10px !important;
  color: var(--text) !important;
  font-size: 13px !important;
  outline: none !important;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--brass) !important;
}
.upload-area {
  border: 2px dashed var(--line);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  background: rgba(0,0,0,0.1);
}
.upload-area:hover {
  border-color: var(--brass-dim);
}
.upload-area .icon {
  font-size: 32px;
  opacity: 0.5;
}
.upload-area p {
  color: var(--text-muted);
  font-size: 13px;
}
.upload-area .format {
  font-size: 11px;
  color: var(--text-muted);
  opacity: 0.6;
}
.upload-area input[type="file"] {
  display: none;
}
.upload-area .btn-upload {
  display: inline-block;
  margin-top: 8px;
  padding: 6px 18px;
  border-radius: 6px;
  background: rgba(199,151,63,0.15);
  border: 1px solid var(--brass-dim);
  color: var(--brass-soft);
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  font-family: 'Manrope', sans-serif;
}
.upload-area .btn-upload:hover {
  background: rgba(199,151,63,0.25);
}
.especie-item {
  background: rgba(0,0,0,0.15);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 12px;
}
.especie-item .header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
}
.especie-item .header .nome {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
}
.especie-item .preview-img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--brass-dim);
}
.especie-item .desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}
.especie-item .actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.especie-item .actions .btn {
  padding: 4px 12px;
  font-size: 11px;
}
.empty-list {
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <button class="burger" onclick="toggleSidebar()">☰ menu</button>
    <section class="page active">

      <div class="topbar">
        <div>
          <h1>✎ Editar Espécies da Home</h1>
          <div class="lede">Configure o nome, descrição e imagem de cada espécie</div>
        </div>
        <div>
          <button class="btn btn-ghost" onclick="location.href='admin-site.html'">← Voltar</button>
          <button class="btn btn-primary" onclick="salvarEspecies()">💾 Salvar</button>
        </div>
      </div>

      <div class="editor-card">
        <h3>🐦 Espécies</h3>
        <p style="color:var(--text-muted);margin-bottom:12px;">Edite as informações de cada espécie que aparece na home.</p>
        <div id="especies-list"></div>
      </div>

    </section>
  </main>
</div>

<script src="auth-client.js"></script>
<script src="sidebar.js"></script>
<script src="db-api.js"></script>
<script>
renderSidebar('admin-site');

// ============================================================
// FUNÇÕES DE BANCO (via API)
// ============================================================

async function getEspecies() {
  const especies = await DB.getConfig('site_especies');
  if (especies && Object.keys(especies).length > 0) {
    return especies;
  }
  
  // Valores padrão
  return {
    'Canário-da-terra': { 
      titulo: 'Canário-da-terra',
      desc: 'Ave admirada pelo canto forte e estalado. Uma das mais procuradas por criadores.',
      imagem: ''
    },
    'Coleiro (Papa-capim)': { 
      titulo: 'Coleiro',
      desc: 'O coleirinho é uma ave passeriforme muito apreciada pelo seu canto melodioso.',
      imagem: ''
    },
    'Trinca-ferro': { 
      titulo: 'Trinca-Ferro',
      desc: 'Um dos pássaros silvestres mais apreciados pelo brasileiro, especialmente pelo seu canto.',
      imagem: ''
    }
  };
}

async function saveEspecies(especies) {
  await DB.setConfig('site_especies', especies);
}

// ============================================================
// VARIÁVEIS
// ============================================================

let especies = {};

// ============================================================
// CARREGAR
// ============================================================

async function carregarEspecies() {
  especies = await getEspecies();
  renderizarEspecies();
}

// ============================================================
// RENDERIZAR
// ============================================================

function renderizarEspecies() {
  const container = document.getElementById('especies-list');
  const nomes = Object.keys(especies);
  
  if (nomes.length === 0) {
    container.innerHTML = '<div class="empty-list">Nenhuma espécie cadastrada.</div>';
    return;
  }
  
  let html = '';
  nomes.forEach(key => {
    const esp = especies[key];
    html += `
      <div class="especie-item">
        <div class="header">
          <span class="nome">${esp.titulo || key}</span>
          ${esp.imagem ? `<img src="${esp.imagem}" class="preview-img" onerror="this.style.display='none'">` : ''}
        </div>
        ${esp.desc ? `<div class="desc">${esp.desc}</div>` : ''}
        <div class="actions">
          <button class="btn btn-ghost" onclick="editarEspecie('${key}')">✎ Editar</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// ============================================================
// EDITAR ESPÉCIE
// ============================================================

async function editarEspecie(key) {
  const esp = especies[key];
  if (!esp) return;
  
  // Criar modal
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); 
    display: flex; align-items: center; justify-content: center; 
    z-index: 1000; padding: 20px;
  `;
  
  const modal = document.createElement('div');
  modal.style.cssText = `
    background: var(--bg-elevated-2); border: 1px solid var(--brass-dim); 
    border-radius: 14px; max-width: 500px; width: 100%; 
    padding: 24px; max-height: 90vh; overflow-y: auto;
  `;
  
  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="font-family:'Fraunces',serif;color:var(--brass-soft);">✎ Editar ${key}</h3>
      <button onclick="this.closest('div[style]').remove()" style="background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;">✕</button>
    </div>
    
    <div class="field">
      <label>Nome da Espécie *</label>
      <input type="text" id="edit-titulo" value="${esp.titulo || ''}" placeholder="Ex: Canário-da-terra">
    </div>
    
    <div class="field">
      <label>Descrição</label>
      <textarea id="edit-desc" rows="3" placeholder="Descrição da espécie">${esp.desc || ''}</textarea>
    </div>
    
    <div class="field">
      <label>Imagem (URL ou upload)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input type="text" id="edit-imagem" value="${esp.imagem || ''}" placeholder="https://exemplo.com/imagem.jpg" style="flex:1;min-width:150px;">
        <div class="upload-area" onclick="document.getElementById('edit-file-input').click()" style="padding:10px;flex-shrink:0;cursor:pointer;">
          <p style="font-size:11px;">📤 Upload</p>
          <input type="file" id="edit-file-input" accept="image/*" onchange="uploadImagemEspecie(event)">
        </div>
      </div>
      <div id="edit-imagem-preview" style="margin-top:8px;">
        ${esp.imagem ? `<img src="${esp.imagem}" style="max-width:100px;max-height:100px;border-radius:8px;border:1px solid var(--line);" onerror="this.style.display='none'">` : ''}
      </div>
    </div>
    
    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);">
      <button onclick="salvarEdicaoEspecie('${key}')" class="btn btn-primary" style="flex:1;">💾 Salvar</button>
    </div>
  `;
  
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  
  // Salvar referência
  window._editKey = key;
}

function uploadImagemEspecie(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  if (!file.type.startsWith('image/')) {
    alert('Selecione uma imagem válida.');
    return;
  }
  
  if (file.size > 10 * 1024 * 1024) {
    alert('A imagem excede 10MB.');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    const input = document.getElementById('edit-imagem');
    const preview = document.getElementById('edit-imagem-preview');
    if (input) {
      input.value = e.target.result;
      preview.innerHTML = `<img src="${e.target.result}" style="max-width:100px;max-height:100px;border-radius:8px;border:1px solid var(--line);">`;
    }
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}

async function salvarEdicaoEspecie(key) {
  const titulo = document.getElementById('edit-titulo').value.trim();
  const desc = document.getElementById('edit-desc').value.trim();
  const imagem = document.getElementById('edit-imagem').value.trim();
  
  if (!titulo) {
    alert('Digite o nome da espécie.');
    return;
  }
  
  especies[key] = {
    ...especies[key],
    titulo: titulo,
    desc: desc,
    imagem: imagem
  };
  
  await saveEspecies(especies);
  renderizarEspecies();
  
  // Fechar modal
  const modal = document.querySelector('div[style*="position: fixed"]');
  if (modal) modal.remove();
  
  alert('✅ Espécie atualizada com sucesso!');
}

// ============================================================
// SALVAR
// ============================================================

async function salvarEspecies() {
  await saveEspecies(especies);
  alert('✅ Espécies salvas com sucesso!');
}

// ============================================================
// INICIALIZAR
// ============================================================

carregarEspecies();
</script>
</body>
</html>
