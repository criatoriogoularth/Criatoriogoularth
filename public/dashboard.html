<!-- dashboard.html - PAINEL (apenas logados) — MIGRADO PARA API -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="tema.js"></script>
<meta charset="UTF-8">
<title>Aviário — Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="temas-modelos.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
}
.stat-card .stat-number {
  font-family: var(--font-titulo,'Fraunces',serif);
  font-size: 32px;
  font-weight: 700;
  color: var(--brass-soft);
  line-height: 1.2;
}
.stat-card .stat-label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-top: 4px;
}
.stat-card .stat-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.stat-card.male .stat-number { color: #3a6a9a; }
.stat-card.female .stat-number { color: #9a5a6a; }
.stat-card.filhote .stat-number { color: var(--sage-soft); }
.table-wrap {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-top: 18px;
}
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table-wrap th {
  background: rgba(var(--shade),0.2);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 12px 16px;
  text-align: left;
}
.table-wrap td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  color: var(--text);
}
.table-wrap tr:last-child td { border-bottom: none; }
.table-wrap .badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.badge-disponivel { background: rgba(var(--sage-rgb,92,154,124),0.2); color: var(--sage-soft); }
.badge-usada { background: rgba(var(--accent-rgb,199,151,63),0.15); color: var(--brass-soft); }
.badge-esgotada { background: rgba(192,89,74,0.2); color: var(--danger-text); }
.species-list {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
}
.species-tag {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.species-tag .count {
  font-weight: 700;
  color: var(--brass-soft);
  font-size: 16px;
}
.section-title {
  font-family: var(--font-titulo,'Fraunces',serif);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin: 24px 0 12px;
}
.section-title:first-of-type { margin-top: 0; }
.empty-state-painel {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.empty-state-painel .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-state-painel h3 {
  font-family: var(--font-titulo,'Fraunces',serif);
  font-size: 18px;
  color: var(--text);
  margin-bottom: 6px;
}
.empty-state-painel p { font-size: 13px; }

/* ===== Avisos ===== */
.avisos-bloco { margin-bottom: 18px; }
.avisos-sub { font-size: 12px; color: var(--text-muted); letter-spacing: .04em; text-transform: uppercase; margin: 14px 0 8px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.aviso-item {
  background: var(--bg-elevated-2); border: 1px solid var(--line); border-left: 4px solid var(--brass);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.45;
}
.aviso-item.nasce-hoje { border-left-color: #5c9a7c; background: rgba(var(--sage-rgb,92,154,124),.10); }
.aviso-item.atrasado { border-left-color: #e0763a; }
.aviso-item.lida { opacity: .6; border-left-color: var(--line); }
.aviso-top { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:baseline; }
.aviso-titulo { font-weight: 700; }
.aviso-quando { font-size: 12px; color: var(--text-muted); }
.aviso-detalhe { color: var(--text-muted); font-size: 13px; margin-top: 2px; }
.aviso-msg { margin-top: 8px; padding: 8px 10px; background: rgba(0,0,0,.18); border-radius: 8px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.aviso-acoes { display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px; }
.aviso-acoes .btn { padding: 6px 12px; font-size: 12px; text-decoration: none; }
.tipo-badge { display:inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-right: 6px; }
.tipo-reserva { background: rgba(var(--sage-rgb,92,154,124),.2); color: #8fc4a6; }
.tipo-duvida { background: rgba(var(--accent-rgb,199,151,63),.2); color: var(--brass-soft); }
.tipo-contato { background: rgba(90,140,200,.2); color: #8fb4e0; }
.contador-aviso { background: #e0763a; color: #fff; font-size: 12px; font-weight: 700; padding: 1px 9px; border-radius: 999px; margin-left: 8px; vertical-align: middle; }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <button class="burger" onclick="toggleSidebar()">☰ menu</button>
    <section class="page active" id="page-dashboard">

      <div class="topbar">
        <div>
          <h1>Painel do Plantel</h1>
          <div class="lede">Visão geral do seu criatório — estatísticas e avisos.</div>
        </div>
        <button class="btn btn-primary" onclick="location.href='cadastro-ave.html'">+ Nova Ave</button>
      </div>

      <div class="stats-grid" id="stats-grid"><div class="empty-state-painel">Carregando...</div></div>

      <div id="avisos-area"></div>

      <div class="section-title">📋 Espécies no Plantel</div>
      <div class="species-list" id="species-list"></div>

    </section>
  </main>
</div>

<script src="auth-client.js"></script>
<script src="sidebar.js"></script>
<script src="db-api.js"></script>
<script>renderSidebar('dashboard');</script>

<script>
async function calcularEstatisticas(aves) {
  return {
    total: aves.length,
    machos: aves.filter(a => a.sexo === 'M').length,
    femeas: aves.filter(a => a.sexo === 'F').length,
    filhotes: aves.filter(a => a.filhote === true).length,
    plantelAtivo: aves.filter(a => a.situacao === 'Plantel').length
  };
}

function contarEspecies(aves) {
  const especies = {};
  aves.forEach(a => {
    if (!a.especie) return;
    especies[a.especie] = (especies[a.especie] || 0) + 1;
  });
  return especies;
}

async function renderizarEstatisticas(aves) {
  const stats = await calcularEstatisticas(aves);
  const grid = document.getElementById('stats-grid');
  if (stats.total === 0) {
    grid.innerHTML = `<div class="empty-state-painel" style="grid-column:1/-1;"><div class="icon">🐦</div><h3>Nenhuma ave cadastrada</h3><p>Cadastre sua primeira ave clicando em "+ Nova Ave".</p></div>`;
    return;
  }
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-number">${stats.total}</div><div class="stat-label">Total de Aves</div><div class="stat-sub">${stats.plantelAtivo} no plantel ativo</div></div>
    <div class="stat-card male"><div class="stat-number">${stats.machos}</div><div class="stat-label">♂ Machos</div></div>
    <div class="stat-card female"><div class="stat-number">${stats.femeas}</div><div class="stat-label">♀ Fêmeas</div></div>
    <div class="stat-card filhote"><div class="stat-number">${stats.filhotes}</div><div class="stat-label">🐣 Filhotes</div></div>
  `;
}

function renderizarEspecies(aves) {
  const especies = contarEspecies(aves);
  const container = document.getElementById('species-list');
  const keys = Object.keys(especies);
  if (keys.length === 0) {
    container.innerHTML = '<div class="empty-note" style="padding:16px;">Nenhuma espécie cadastrada.</div>';
    return;
  }
  container.innerHTML = Object.entries(especies).map(([nome, qtd]) => `
    <div class="species-tag"><span>${nome}</span><span class="count">${qtd}</span></div>
  `).join('');
}

// ============================================================
// AVISOS: filhotes por nascer + caixa de mensagens do site
// Cada parte só aparece se houver alguma coisa para mostrar.
// ============================================================

let MENSAGENS = [];
let mostrarLidas = false;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function hojeZerado() { const h = new Date(); h.setHours(0, 0, 0, 0); return h; }

function diasAte(dataIso) {
  const [a, m, d] = String(dataIso).slice(0, 10).split('-').map(Number);
  return Math.round((new Date(a, m - 1, d) - hojeZerado()) / 86400000);
}

function fmtDataBR(iso) {
  const p = String(iso).slice(0, 10).split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : '';
}

// Mostra a data/hora como foi gravada (sem converter fuso).
function fmtQuando(iso) {
  const t = String(iso || '');
  return t.length >= 16 ? `${t.slice(8, 10)}/${t.slice(5, 7)} às ${t.slice(11, 16)}` : '';
}

function textoPrazo(dias) {
  if (dias === 0) return '🐣 Nasce HOJE';
  if (dias === 1) return 'Nasce amanhã';
  if (dias > 1) return `Nasce em ${dias} dias`;
  if (dias === -1) return 'Previsão era ontem';
  return `Previsão passou há ${-dias} dias`;
}

const DIAS_OVOSCOPIA = 5; // ovoscopia = 5 dias depois que a fêmea começa a chocar

function somarDiasIso(iso, n) {
  const [a, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  const dt = new Date(a, m - 1, d + n);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}

// Ovoscopias que já estão no dia (ou atrasadas) e ainda não foram marcadas como feitas.
function ovoscopiasPendentes(ativas) {
  return ativas
    .filter(r => r.inicioChoco && !r.ovoscopiaFeita)
    .map(r => {
      const data = somarDiasIso(r.inicioChoco, DIAS_OVOSCOPIA);
      return { r, data, dias: diasAte(data) };
    })
    // só avisa a partir do dia; e para de insistir depois que o nascimento previsto já passou
    .filter(x => x.dias <= 0 && (!x.r.previsaoNascimento || diasAte(x.r.previsaoNascimento) >= 0))
    .sort((a, b) => a.dias - b.dias);
}

async function marcarOvoscopia(id) {
  try {
    const hoje = new Date();
    const iso = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
    await DB.update(DB.TABLES.REPRODUCOES, id, { ovoscopiaFeita: true, ovoscopiaData: iso });
    REPRODUCOES = await DB.getAll(DB.TABLES.REPRODUCOES);
    renderizarAvisos();
  } catch (e) { alert('Não foi possível registrar a ovoscopia: ' + e.message); }
}

function montarFilhotesPorNascer(reproducoes) {
  const ativas = reproducoes.filter(r => r.status === 'Ativo' && r.finalizada !== 'Sim');
  const ovoscopias = ovoscopiasPendentes(ativas);

  const chocando = ativas
    .filter(r => r.previsaoNascimento)
    .map(r => ({ r, dias: diasAte(r.previsaoNascimento) }))
    .filter(x => x.dias <= 14 && x.dias >= -15)
    .sort((a, b) => a.dias - b.dias);

  const botando = ativas.filter(r => !r.inicioChoco && !r.previsaoNascimento);

  let html = '';
  if (ovoscopias.length) {
    html += `<div class="avisos-sub">🔍 Ovoscopia</div>`;
    html += ovoscopias.map(({ r, dias, data }) => `
      <div class="aviso-item ${dias === 0 ? 'nasce-hoje' : 'atrasado'}">
        <div class="aviso-top">
          <span class="aviso-titulo">${dias === 0 ? 'Hoje é dia de ovoscopia' : 'Ovoscopia atrasada há ' + (-dias) + ' dia' + (dias < -1 ? 's' : '')} — ${esc(r.femeaNome)}${r.machoNome ? ' × ' + esc(r.machoNome) : ''}</span>
          <span class="aviso-quando">choco desde ${fmtDataBR(r.inicioChoco)}</span>
        </div>
        <div class="aviso-detalhe">${DIAS_OVOSCOPIA} dias de choco completos em ${fmtDataBR(data)}. Confira os ovos contra a luz e separe férteis de inférteis.</div>
        <div class="aviso-acoes"><button class="btn btn-primary" onclick="marcarOvoscopia(${r.id})">✔ Ovoscopia feita</button></div>
      </div>`).join('');
  }
  if (chocando.length) {
    html += `<div class="avisos-sub">🥚 Filhotes para nascer</div>`;
    html += chocando.map(({ r, dias }) => `
      <div class="aviso-item ${dias === 0 ? 'nasce-hoje' : dias < 0 ? 'atrasado' : ''}">
        <div class="aviso-top">
          <span class="aviso-titulo">${textoPrazo(dias)} — ${esc(r.femeaNome)}${r.machoNome ? ' × ' + esc(r.machoNome) : ''}</span>
          <span class="aviso-quando">previsão ${fmtDataBR(r.previsaoNascimento)}</span>
        </div>
        <div class="aviso-detalhe">${r.totalOvos ? `${r.totalOvos} ovo(s)${r.ovosFerteis ? ` · ${r.ovosFerteis} fértil(is)` : ''}` : 'Sem ovos contados'}${r.inicioChoco ? ` · choco iniciado em ${fmtDataBR(r.inicioChoco)}` : ''}</div>
      </div>`).join('');
  }
  if (botando.length) {
    html += `<div class="avisos-sub">🪺 Ainda botando</div>`;
    html += botando.map(r => `
      <div class="aviso-item">
        <div class="aviso-top">
          <span class="aviso-titulo">${esc(r.femeaNome)}${r.machoNome ? ' × ' + esc(r.machoNome) : ''}</span>
          <span class="aviso-quando">${r.primeiroOvo ? 'primeiro ovo em ' + fmtDataBR(r.primeiroOvo) : ''}</span>
        </div>
        <div class="aviso-detalhe">${r.totalOvos ? r.totalOvos + ' ovo(s) até agora' : 'Sem ovos contados'} · choco ainda não começou</div>
      </div>`).join('');
  }
  return { html, total: ovoscopias.length + chocando.length + botando.length };
}

function linkResposta(m) {
  const c = String(m.contato || '').trim();
  if (c.includes('@')) {
    return `<a class="btn btn-primary" href="mailto:${c}?subject=${encodeURIComponent('Re: ' + (m.assunto || 'Contato pelo site'))}">✉️ Responder por e-mail</a>`;
  }
  let d = c.replace(/\D/g, '');
  if (d.length >= 10 && d.length <= 11) d = '55' + d; // DDD + número -> adiciona o Brasil
  if (d.length >= 12) {
    const texto = `Olá, ${m.nome}! Aqui é do Criatório Goularth, recebi sua mensagem${m.aveNome ? ' sobre ' + m.aveNome : ''}.`;
    return `<a class="btn btn-primary" target="_blank" rel="noopener" href="https://wa.me/${d}?text=${encodeURIComponent(texto)}">💬 Responder no WhatsApp</a>`;
  }
  return '';
}

const ROTULO_TIPO = { reserva: ['📩 Reserva', 'tipo-reserva'], duvida: ['❓ Dúvida', 'tipo-duvida'], contato: ['✉️ Contato', 'tipo-contato'] };

function montarMensagens() {
  const naoLidas = MENSAGENS.filter(m => !m.lida);
  const lidas = MENSAGENS.filter(m => m.lida);
  if (!MENSAGENS.length) return { html: '', total: 0 };

  const lista = mostrarLidas ? MENSAGENS : naoLidas;
  const itens = lista.map(m => {
    const [rotulo, cls] = ROTULO_TIPO[m.tipo] || ROTULO_TIPO.contato;
    return `
      <div class="aviso-item ${m.lida ? 'lida' : ''}">
        <div class="aviso-top">
          <span class="aviso-titulo"><span class="tipo-badge ${cls}">${rotulo}</span>${esc(m.nome)}</span>
          <span class="aviso-quando">${fmtQuando(m.criadoEm)}</span>
        </div>
        ${m.aveNome ? `<div class="aviso-detalhe">🐦 ${esc(m.aveNome)}</div>` : ''}
        ${m.mensagem ? `<div class="aviso-msg">${esc(m.mensagem)}</div>` : ''}
        <div class="aviso-detalhe" style="margin-top:6px;">📞 ${esc(m.contato)}</div>
        <div class="aviso-acoes">
          ${linkResposta(m)}
          <button class="btn" onclick="alternarLida(${m.id}, ${!m.lida})">${m.lida ? '↩ Marcar como não lida' : '✔ Marcar como lida'}</button>
          <button class="btn" onclick="excluirMensagem(${m.id})">🗑 Excluir</button>
        </div>
      </div>`;
  }).join('');

  const cabecalho = `
    <div class="avisos-sub">📩 Mensagens do site
      ${naoLidas.length ? `<span class="contador-aviso">${naoLidas.length} nova(s)</span>` : ''}
      ${naoLidas.length > 1 ? `<button class="btn" style="padding:3px 10px;font-size:11px;" onclick="lerTodas()">✔ Marcar todas como lidas</button>` : ''}
      ${lidas.length ? `<button class="btn" style="padding:3px 10px;font-size:11px;" onclick="alternarMostrarLidas()">${mostrarLidas ? 'Ocultar lidas' : `Ver lidas (${lidas.length})`}</button>` : ''}
    </div>`;
  const vazio = !lista.length ? `<div class="empty-note" style="padding:10px 2px;">✅ Nenhuma mensagem nova.</div>` : '';
  return { html: cabecalho + itens + vazio, total: naoLidas.length };
}

let REPRODUCOES = [];

function renderizarAvisos() {
  const area = document.getElementById('avisos-area');
  const nasc = montarFilhotesPorNascer(REPRODUCOES);
  const msg = montarMensagens();
  const total = nasc.total + msg.total;

  let corpo = nasc.html + msg.html;
  if (!corpo) corpo = '<div class="empty-note" style="padding:6px 2px 10px;">✅ Nenhum aviso no momento.</div>';
  area.innerHTML = `
    <div class="section-title">🔔 Avisos${total ? `<span class="contador-aviso">${total}</span>` : ''}</div>
    <div class="avisos-bloco">${corpo}</div>`;
}

async function carregarMensagens() {
  try { MENSAGENS = await DB.getMensagens(); } catch (e) { MENSAGENS = []; }
}

async function alternarLida(id, lida) {
  try { await DB.marcarMensagem(id, lida); await carregarMensagens(); renderizarAvisos(); }
  catch (e) { alert('Não foi possível atualizar: ' + e.message); }
}
async function lerTodas() {
  try { await DB.marcarTodasMensagensLidas(); await carregarMensagens(); renderizarAvisos(); }
  catch (e) { alert('Não foi possível atualizar: ' + e.message); }
}
async function excluirMensagem(id) {
  if (!confirm('Excluir esta mensagem de vez?')) return;
  try { await DB.excluirMensagem(id); await carregarMensagens(); renderizarAvisos(); }
  catch (e) { alert('Não foi possível excluir: ' + e.message); }
}
function alternarMostrarLidas() { mostrarLidas = !mostrarLidas; renderizarAvisos(); }

async function iniciar() {
  try {
    const [aves, reproducoes] = await Promise.all([
      DB.getAll(DB.TABLES.AVES),
      DB.getAll(DB.TABLES.REPRODUCOES).catch(() => []),
      carregarMensagens()
    ]);
    REPRODUCOES = reproducoes;
    await renderizarEstatisticas(aves);
    renderizarAvisos();
    renderizarEspecies(aves);
  } catch (e) {
    console.error('Erro ao carregar painel:', e);
  }
}

iniciar();

// Confere mensagens novas do site a cada minuto, sem precisar recarregar a página.
setInterval(async () => { await carregarMensagens(); renderizarAvisos(); }, 60000);
</script>
</body>
</html>
