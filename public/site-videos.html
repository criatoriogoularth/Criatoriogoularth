<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criatório Goularth — Vídeos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-site.css">
<style>
.site-header {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
}

.site-nav {
  background: var(--bg-elevated);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.nav-links {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
}

.site-main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 30px 24px 60px;
}

.site-main .subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  border-bottom: 2px solid var(--line);
  margin-bottom: 20px;
  padding-bottom: 0;
}

.tabs button {
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-texto);
  font-size: 15px;
  font-weight: 600;
  padding: 10px 20px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: .15s ease;
  margin-bottom: -2px;
}

.tabs button:hover {
  color: var(--text);
}

.tabs button.active {
  color: var(--brass-soft);
  border-bottom-color: var(--brass);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.videos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.video-item {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  transition: .15s ease;
}

.video-item:hover {
  border-color: var(--brass-dim);
  transform: translateY(-3px);
}

.video-item .video-wrapper {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
}

.video-item .video-wrapper iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.video-item .info {
  padding: 10px 14px;
}

.video-item .info .titulo {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 2px;
}

.video-item .info .descricao {
  font-size: 12px;
  color: var(--text-muted);
}

.video-item .info .categoria {
  display: inline-block;
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 12px;
  background: rgba(199,151,63,0.12);
  color: var(--brass-soft);
  margin-top: 4px;
}

.empty-videos {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

.empty-videos .icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.4;
}

@media (max-width: 768px) {
  .site-nav {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px 12px;
  }
  .site-nav .logo {
    justify-content: center;
  }
  .nav-links {
    justify-content: center;
  }
  .nav-buttons {
    justify-content: center;
  }
  .videos-grid {
    grid-template-columns: 1fr;
  }
  .tabs button {
    font-size: 13px;
    padding: 8px 14px;
  }
  .dropdown-content {
    position: static;
    box-shadow: none;
    border: none;
    background: rgba(0,0,0,0.1);
    border-radius: 0;
  }
  .sub-dropdown-content {
    position: static;
    box-shadow: none;
    border: none;
    background: rgba(0,0,0,0.05);
    border-radius: 0;
    padding-left: 16px;
  }
  .dropdown:hover .dropdown-content {
    display: none;
  }
  .dropdown.active .dropdown-content {
    display: block;
  }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-nav">
      <div class="logo" id="logo-section">
        <!-- Preenchido pelo JavaScript -->
      </div>
      <div class="nav-links" id="nav-links">
        <a href="site-home.html">Home</a>
        <a href="site-criatorio.html">O Criatório</a>
        <a href="site-noticias.html">Notícias</a>
        <div class="dropdown">
          <a>Plantel</a>
          <div class="dropdown-content" id="plantel-dropdown"></div>
        </div>
        <a href="site-adultos.html">Adultos</a>
        <a href="site-filhotes.html">Filhotes</a>
        <a href="site-fotos.html">Fotos</a>
        <a href="site-videos.html" class="active">Vídeos</a>
        <a href="site-crachas.html">Crachás</a>
        <a href="site-contato.html">Contato</a>
      </div>
      <div class="nav-buttons">
        <a href="login.html" class="btn-login-site">🔐 Entrar</a>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="subtitle">Vídeos do criatório no YouTube</div>

    <div class="tabs" id="videos-tabs">
      <button class="active" data-tab="videos-criacao" onclick="switchTab('videos-criacao', this)">🎬 Criação</button>
      <button data-tab="videos-torneios" onclick="switchTab('videos-torneios', this)">🏆 Torneios</button>
    </div>

    <div class="tab-content active" id="videos-criacao">
      <div id="videos-criacao-grid" class="videos-grid"></div>
    </div>

    <div class="tab-content" id="videos-torneios">
      <div id="videos-torneios-grid" class="videos-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="links">
      <a href="site-home.html">Home</a>
      <a href="site-criatorio.html">O Criatório</a>
      <a href="site-noticias.html">Notícias</a>
      <a href="site-plantel.html">Plantel</a>
      <a href="site-adultos.html">Adultos</a>
      <a href="site-filhotes.html">Filhotes</a>
      <a href="site-fotos.html">Fotos</a>
      <a href="site-videos.html">Vídeos</a>
      <a href="site-crachas.html">Crachás</a>
      <a href="site-contato.html">Contato</a>
    </div>
    <p>© 2026 Criatório Goularth · Todos os direitos reservados</p>
  </footer>

  <script src="db-api.js"></script>
  <script>
    async function getPersonalizacao() {
      return (await DB.getConfig('site_personalizacao')) || {};
    }

    async function carregarLogo() {
      const personalizacao = await getPersonalizacao();
      const logoSection = document.getElementById('logo-section');
      
      const nome = personalizacao.nome || 'Criatório Goularth';
      const subtitulo = personalizacao.subtitulo || '';
      const iniciais = personalizacao.logoIniciais || 'CG';
      const logoUrl = personalizacao.logoUrl || '';
      const logoTamanho = personalizacao.logoTamanho || 76;
      const nomeTamanho = personalizacao.nomeTamanho || 20;
      
      let logoHtml = '';
      if (logoUrl) {
        logoHtml = `<img src="${logoUrl}" style="width:${logoTamanho}px;height:${logoTamanho}px;border-radius:50%;border:2px solid var(--brass);object-fit:cover;" onerror="this.parentElement.innerHTML='<div class=\\'mark\\' style=\\'width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;\\'>${iniciais}</div>'">`;
      } else {
        logoHtml = `<div class="mark" style="width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;">${iniciais}</div>`;
      }
      
      logoSection.innerHTML = `
        ${logoHtml}
        <div>
          <div class="name" style="font-size:${nomeTamanho}px;">${nome}</div>
          ${subtitulo ? `<div class="sub">${subtitulo}</div>` : ''}
        </div>
      `;
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      return match ? match[1] : null;
    }

    async function getVideos() {
      const videos = await DB.getConfig('site_videos');
      if (videos && videos.length > 0) return videos;

      const conteudo = await DB.getConfig('site_conteudo');
      if (conteudo && conteudo.videos && conteudo.videos.length > 0) return conteudo.videos;

      return [];
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('#videos-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }

    // A visibilidade das abas do menu agora é aplicada de forma centralizada
    // em site-buttons.js (mesma lógica em todas as páginas do site).

    async function carregarDropdownPlantel() {
      const avesSite = await DB.getAvesPublicas();
      const dropdownPlantel = document.getElementById('plantel-dropdown');
      const especiesPlantel = [...new Set(avesSite.map(a => a.especie).filter(Boolean))];
      
      let dropdownHtml = '';
      especiesPlantel.sort().forEach(esp => {
        const count = avesSite.filter(a => a.especie === esp).length;
        if (count === 0) return;
        
        dropdownHtml += `
          <div class="sub-dropdown">
            <a href="site-plantel.html?especie=${encodeURIComponent(esp)}">${esp}</a>
            <div class="sub-dropdown-content">
              <a href="site-plantel.html?especie=${encodeURIComponent(esp)}&sexo=M">${esp} - <span class="sexo-icon">♂</span> Machos</a>
              <a href="site-plantel.html?especie=${encodeURIComponent(esp)}&sexo=F">${esp} - <span class="sexo-icon">♀</span> Fêmeas</a>
            </div>
          </div>
        `;
      });
      dropdownPlantel.innerHTML = dropdownHtml || `<a href="site-plantel.html" style="display:block;padding:8px 16px;color:var(--text-muted);text-decoration:none;">Ver Plantel</a>`;
    }

    async function renderizarVideos() {
      const personalizacao = await getPersonalizacao();
      const vis = personalizacao.visibilidade || {};
      const videos = await getVideos();

      const criacao = videos.filter(v => v.categoria === 'Criação' || !v.categoria);
      const torneios = videos.filter(v => v.categoria === 'Torneios');
      
      const mostrarCriacao = vis.videosCriacao !== false;
      const mostrarTorneios = vis.videosTorneios !== false;
      
      // Mostrar/esconder abas
      const tabCriacao = document.querySelector('[data-tab="videos-criacao"]');
      const tabTorneios = document.querySelector('[data-tab="videos-torneios"]');
      if (tabCriacao) tabCriacao.style.display = mostrarCriacao ? '' : 'none';
      if (tabTorneios) tabTorneios.style.display = mostrarTorneios ? '' : 'none';
      
      // Se nenhuma categoria estiver visível, mostrar mensagem
      if (!mostrarCriacao && !mostrarTorneios) {
        document.getElementById('videos-criacao-grid').innerHTML = `
          <div class="empty-videos"><div class="icon">🎬</div><p>Nenhuma categoria de vídeos disponível no momento.</p></div>
        `;
        document.getElementById('videos-torneios-grid').innerHTML = '';
        return;
      }
      
      // Se só uma categoria estiver visível, ativar ela automaticamente
      if (mostrarCriacao && !mostrarTorneios) {
        const btn = document.querySelector('[data-tab="videos-criacao"]');
        if (btn) switchTab('videos-criacao', btn);
      } else if (!mostrarCriacao && mostrarTorneios) {
        const btn = document.querySelector('[data-tab="videos-torneios"]');
        if (btn) switchTab('videos-torneios', btn);
      }
      
      renderizarGrid('videos-criacao-grid', criacao);
      renderizarGrid('videos-torneios-grid', torneios);
    }

    function renderizarGrid(gridId, videos) {
      const grid = document.getElementById(gridId);
      
      if (videos.length === 0) {
        grid.innerHTML = `
          <div class="empty-videos">
            <div class="icon">🎬</div>
            <p>Nenhum vídeo nesta categoria.</p>
          </div>
        `;
        return;
      }
      
      grid.innerHTML = videos.map(video => {
        const videoId = extractYouTubeId(video.url);
        const embedUrl = videoId ? `https://www.youtube.com/embed/${videoId}` : '';
        
        return `
          <div class="video-item">
            <div class="video-wrapper">
              ${embedUrl ? `<iframe src="${embedUrl}" allowfullscreen loading="lazy"></iframe>` : 
                `<div style="display:flex;align-items:center;justify-content:center;height:200px;background:var(--bg);color:var(--text-muted);">URL inválida</div>`}
            </div>
            <div class="info">
              <div class="titulo">${video.titulo || 'Sem título'}</div>
              ${video.descricao ? `<div class="descricao">${video.descricao}</div>` : ''}
              <span class="categoria">${video.categoria || 'Criação'}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    carregarLogo();
    carregarDropdownPlantel();
    renderizarVideos();
  </script>
  <script src="site-buttons.js"></script>
</body>
</html>
