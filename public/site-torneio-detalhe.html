<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criatório Goularth — Resultado da Etapa</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-site.css">
<style>
.site-header {
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--line);
}

.site-nav {
  background: var(--bg-elevated);
  padding: 12px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.nav-links {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
}

.site-main {
  max-width: 900px;
  margin: 0 auto;
  padding: 30px 24px 60px;
}

.breadcrumb {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.breadcrumb a {
  color: var(--text-muted);
  text-decoration: none;
}

.breadcrumb a:hover {
  color: var(--brass-soft);
}

.etapa-header {
  margin-bottom: 24px;
}

.etapa-header .categoria {
  font-size: 12px;
  color: var(--brass-soft);
  text-transform: uppercase;
  letter-spacing: .06em;
  font-weight: 600;
  margin-bottom: 4px;
}

.etapa-header h1 {
  font-family: var(--font-titulo);
  font-size: 28px;
  color: var(--text);
  margin-bottom: 4px;
}

.etapa-header .data {
  font-size: 13px;
  color: var(--text-muted);
}

/* ---- exibição do arquivo (imagem ou PDF) ---- */
.arquivo-wrapper {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  padding: 12px;
  text-align: center;
}

.arquivo-wrapper img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  display: block;
  margin: 0 auto;
}

.arquivo-wrapper .pdf-frame {
  width: 100%;
  height: 80vh;
  border: none;
  border-radius: 8px;
}

.arquivo-wrapper .pdf-fallback {
  padding: 30px 20px;
  color: var(--text-muted);
}

.arquivo-wrapper .pdf-fallback a {
  color: var(--brass-soft);
  font-weight: 600;
}

.empty-etapa {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-etapa .icon {
  font-size: 56px;
  margin-bottom: 16px;
  opacity: 0.4;
}

@media (max-width: 768px) {
  .site-nav {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
    padding: 8px 12px;
  }
  .site-nav .logo {
    justify-content: center;
  }
  .nav-links {
    justify-content: center;
  }
  .nav-buttons {
    justify-content: center;
  }
  .arquivo-wrapper .pdf-frame {
    height: 65vh;
  }
}
</style>
</head>
<body>
  <header class="site-header">
    <div class="site-nav">
      <div class="logo" id="logo-section">
        <!-- Preenchido pelo JavaScript -->
      </div>
      <div class="nav-links">
        <a href="site-home.html">Home</a>
        <a href="site-criatorio.html">O Criatório</a>
        <a href="site-noticias.html">Notícias</a>
        <a href="site-plantel.html">Plantel</a>
        <a href="site-adultos.html">Adultos</a>
        <a href="site-filhotes.html">Filhotes</a>
        <a href="site-fotos.html">Fotos</a>
        <a href="site-videos.html">Vídeos</a>
        <a href="site-torneios.html" class="active">Copas</a>
        <a href="site-crachas.html">Crachás</a>
        <a href="site-contato.html">Contato</a>
      </div>
      <div class="nav-buttons">
        <a href="login.html" class="btn-login-site">🔐 Entrar</a>
      </div>
    </div>
  </header>

  <main class="site-main">
    <div class="breadcrumb"><a href="site-torneios.html">← Voltar para Copas e Torneios</a></div>
    <div id="etapa-content">
      <!-- Preenchido pelo JavaScript -->
    </div>
  </main>

  <footer class="site-footer">
    <div class="links">
      <a href="site-home.html">Home</a>
      <a href="site-criatorio.html">O Criatório</a>
      <a href="site-noticias.html">Notícias</a>
      <a href="site-plantel.html">Plantel</a>
      <a href="site-adultos.html">Adultos</a>
      <a href="site-filhotes.html">Filhotes</a>
      <a href="site-fotos.html">Fotos</a>
      <a href="site-videos.html">Vídeos</a>
      <a href="site-torneios.html">Copas</a>
      <a href="site-crachas.html">Crachás</a>
      <a href="site-contato.html">Contato</a>
    </div>
    <p>© 2026 Criatório Goularth · Todos os direitos reservados</p>
  </footer>

  <script src="db-api.js"></script>
  <script>
    async function getPersonalizacao() {
      return (await DB.getConfig('site_personalizacao')) || {};
    }

    async function carregarLogo() {
      const personalizacao = await getPersonalizacao();
      const logoSection = document.getElementById('logo-section');

      const nome = personalizacao.nome || 'Criatório Goularth';
      const subtitulo = personalizacao.subtitulo || '';
      const iniciais = personalizacao.logoIniciais || 'CG';
      const logoUrl = personalizacao.logoUrl || '';
      const logoTamanho = personalizacao.logoTamanho || 76;
      const nomeTamanho = personalizacao.nomeTamanho || 20;

      let logoHtml = '';
      if (logoUrl) {
        logoHtml = `<img src="${logoUrl}" style="width:${logoTamanho}px;height:${logoTamanho}px;border-radius:50%;border:2px solid var(--brass);object-fit:cover;" onerror="this.parentElement.innerHTML='<div class=\\'mark\\' style=\\'width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;\\'>${iniciais}</div>'">`;
      } else {
        logoHtml = `<div class="mark" style="width:${logoTamanho}px;height:${logoTamanho}px;font-size:${logoTamanho * 0.4}px;">${iniciais}</div>`;
      }

      logoSection.innerHTML = `
        ${logoHtml}
        <div>
          <div class="name" style="font-size:${nomeTamanho}px;">${nome}</div>
          ${subtitulo ? `<div class="sub">${subtitulo}</div>` : ''}
        </div>
      `;
    }

    function formatarData(data) {
      if (!data) return '';
      const partes = String(data).slice(0, 10).split('-');
      if (partes.length === 3) {
        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        return `${parseInt(partes[2])} de ${meses[parseInt(partes[1])-1]} de ${partes[0]}`;
      }
      return data;
    }

    function getIdDaUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function renderizarEtapa() {
      const container = document.getElementById('etapa-content');
      const id = getIdDaUrl();

      if (!id) {
        container.innerHTML = `
          <div class="empty-etapa">
            <div class="icon">🏆</div>
            <p>Etapa não especificada.</p>
          </div>
        `;
        return;
      }

      let etapa = null;
      try {
        etapa = await DB.getTorneioPublico(id);
      } catch (e) {
        etapa = null;
      }

      if (!etapa) {
        container.innerHTML = `
          <div class="empty-etapa">
            <div class="icon">🏆</div>
            <p>Esta etapa não foi encontrada ou não está mais disponível.</p>
          </div>
        `;
        return;
      }

      document.title = `Criatório Goularth — ${etapa.etapa}`;

      let arquivoHtml = '';
      if (!etapa.arquivoUrl) {
        arquivoHtml = `
          <div class="empty-etapa">
            <div class="icon">📋</div>
            <p>O resultado desta etapa ainda não foi publicado.</p>
          </div>
        `;
      } else if (etapa.arquivoTipo === 'pdf') {
        arquivoHtml = `
          <div class="arquivo-wrapper">
            <iframe class="pdf-frame" src="${etapa.arquivoUrl}"></iframe>
            <div class="pdf-fallback" style="font-size:12px;">
              Não consegue ver o PDF? <a href="${etapa.arquivoUrl}" target="_blank" rel="noopener">Abrir em nova aba</a>
            </div>
          </div>
        `;
      } else {
        arquivoHtml = `
          <div class="arquivo-wrapper">
            <img src="${etapa.arquivoUrl}" alt="${etapa.etapa}" onerror="this.parentElement.innerHTML='<div class=\\'empty-etapa\\'><div class=\\'icon\\'>❌</div><p>Não foi possível carregar a imagem.</p></div>'">
          </div>
        `;
      }

      container.innerHTML = `
        <div class="etapa-header">
          <div class="categoria">${etapa.categoria}</div>
          <h1>${etapa.etapa}</h1>
          ${etapa.data ? `<div class="data">📅 ${formatarData(etapa.data)}</div>` : ''}
        </div>
        ${arquivoHtml}
      `;
    }

    carregarLogo();
    renderizarEtapa();
  </script>
  <script src="site-buttons.js"></script>
</body>
</html>
