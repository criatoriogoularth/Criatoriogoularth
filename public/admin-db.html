<!-- admin-db.html - CONSERTADO: a versão antiga chamava DB.isAdmin(), DB.exportarMeuCriatorio()
     e outras funções que nunca existiram no db.js single-user. Reescrito do zero,
     mais simples, usando só o que a API realmente oferece. -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aviário — Backup & Dados</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="tema.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.db-admin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-top: 18px;
}
.db-card {
  background: var(--bg-elevated-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  text-align: center;
}
.db-card .count {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--brass-soft);
}
.db-card .label {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}
.db-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}
.db-actions .btn {
  flex: 1;
  justify-content: center;
  min-width: 160px;
}
.db-actions .btn-success {
  background: rgba(92,154,124,0.15);
  border: 1px solid rgba(92,154,124,0.3);
  color: var(--sage-soft);
}
.db-actions .btn-success:hover { background: rgba(92,154,124,0.25); }
.modal-box .preview-json {
  background: rgba(var(--shade),0.2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  max-height: 300px;
  overflow: auto;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  white-space: pre-wrap;
  word-break: break-all;
}
.preview-count { font-size: 12px; color: var(--text-muted); margin: 8px 0; }
.preview-count strong { color: var(--brass-soft); }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <button class="burger" onclick="toggleSidebar()">☰ menu</button>
    <section class="page active" id="page-admin-db">

      <div class="topbar">
        <div>
          <h1>🗄️ Backup & Dados</h1>
          <div class="lede">Exporte um arquivo de backup ou importe dados de um backup anterior.</div>
        </div>
      </div>

      <div class="db-admin-grid" id="db-stats">
        <div class="db-card"><div class="count">…</div><div class="label">Carregando</div></div>
      </div>

      <div class="db-actions">
        <button class="btn btn-success" onclick="exportarBackup()">📤 Baixar Backup</button>
        <button class="btn btn-primary" onclick="importarBackup()">📥 Importar Backup</button>
      </div>

      <div style="margin-top:20px;display:none;" id="preview-container">
        <div class="preview-count" id="preview-count"></div>
        <pre id="db-export-preview" style="background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);padding:16px;overflow:auto;max-height:300px;font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;"></pre>
      </div>

    </section>
  </main>
</div>

<script src="auth-client.js"></script>
<script src="sidebar.js"></script>
<script src="db-api.js"></script>
<script>
renderSidebar('admin-db');

async function atualizarStats() {
  const grid = document.getElementById('db-stats');
  try {
    const [aves, anilhas, reproducoes] = await Promise.all([
      DB.getAll(DB.TABLES.AVES),
      DB.getAll(DB.TABLES.ANILHAS),
      DB.getAll(DB.TABLES.REPRODUCOES)
    ]);
    grid.innerHTML = `
      <div class="db-card"><div class="count">${aves.length}</div><div class="label">🐦 Aves</div></div>
      <div class="db-card"><div class="count">${anilhas.length}</div><div class="label">🏷️ Anilhas</div></div>
      <div class="db-card"><div class="count">${reproducoes.length}</div><div class="label">🥚 Reproduções</div></div>
    `;
  } catch (e) {
    grid.innerHTML = `<div class="db-card"><div class="label">❌ Erro ao carregar estatísticas</div></div>`;
  }
}

// ============================================================
// BACKUP COMPLETO
// ============================================================
// CORREÇÃO: o backup antigo usava a listagem "leve" das aves (sem fotos, CIG e laudo),
// não guardava ancestrais nem as configurações do site, e ainda despejava o arquivo inteiro
// numa caixa de texto (travava com muitas fotos). Agora vai tudo, e a tela mostra só a contagem.

const CHAVES_CONFIG = [
  'site_personalizacao', 'site_especies', 'site_noticias', 'site_fotos', 'site_videos',
  'site_banner', 'site_banners', 'site_conteudo', 'especies_aves', 'dados_criatorio',
  'cert_config', 'site_parceiros'
];

function mostrarResumo(texto) {
  document.getElementById('preview-container').style.display = 'block';
  document.getElementById('preview-count').innerHTML = texto;
  const pre = document.getElementById('db-export-preview');
  if (pre) pre.style.display = 'none';
}

async function exportarBackup() {
  try {
    mostrarResumo('⏳ Reunindo os dados (isso pode demorar se houver muitas fotos)...');

    const [aves, anilhas, reproducoes, ancestrais, torneios] = await Promise.all([
      DB.getAvesBackupCompleto(),
      DB.getAll(DB.TABLES.ANILHAS),
      DB.getAll(DB.TABLES.REPRODUCOES),
      DB.getAncestrais().catch(() => []),
      DB.getTorneios().catch(() => [])
    ]);

    const config = {};
    for (const chave of CHAVES_CONFIG) {
      try {
        const v = await DB.getConfig(chave);
        if (v !== null && v !== undefined) config[chave] = v;
      } catch (e) { /* chave sem valor: ignora */ }
    }

    const dados = {
      dataExportacao: new Date().toISOString(),
      versao: '3.0',
      dados: { aves, anilhas, reproducoes, ancestrais, torneios, config }
    };

    mostrarResumo(`<strong>📊 Backup</strong> · ${aves.length} aves (com fotos e documentos) · ${anilhas.length} anilhas · ${reproducoes.length} reproduções · ${ancestrais.length} ancestrais · ${torneios.length} etapas de copas · ${Object.keys(config).length} configurações do site`);

    const json = JSON.stringify(dados);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_criatorio_${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    mostrarResumo('❌ Falha no backup.');
    alert('❌ Erro ao exportar: ' + e.message);
  }
}

// ============================================================
// IMPORTAR
// ============================================================
function limparCamposDeControle(obj) {
  const { id, usuario_id, usuarioId, criado_em, criadoEm, atualizado_em, atualizadoEm, ...resto } = obj;
  return resto;
}

function importarBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onerror = () => alert('❌ Não consegui ler o arquivo.');
    reader.onload = async function (event) {
      try {
        const backup = JSON.parse(event.target.result);
        if (!backup.dados) throw new Error('Arquivo de backup inválido.');

        if (!confirm('⚠️ Isso vai ADICIONAR os registros do backup ao que já existe (sem apagar nada). Aves e anilhas que já existirem são ignoradas. Continuar?')) return;

        let importados = 0, ignorados = 0, falhas = 0;
        const erros = [];
        const tentar = async (rotulo, fn) => {
          try { await fn(); importados++; }
          catch (err) { falhas++; if (erros.length < 5) erros.push(`${rotulo}: ${err.message}`); }
        };

        mostrarResumo('⏳ Importando... não feche esta página.');

        if (Array.isArray(backup.dados.aves)) {
          const existentes = await DB.getAll(DB.TABLES.AVES);
          const anilhasExistentes = new Set(existentes.map(a => a.anilha));
          for (const ave of backup.dados.aves) {
            if (ave.anilha && anilhasExistentes.has(ave.anilha)) { ignorados++; continue; }
            await tentar(`ave ${ave.nome || ave.anilha}`, () => DB.add(DB.TABLES.AVES, limparCamposDeControle(ave)));
            if (ave.anilha) anilhasExistentes.add(ave.anilha);
          }
        }

        if (Array.isArray(backup.dados.anilhas)) {
          const existentes = await DB.getAll(DB.TABLES.ANILHAS);
          const numerosExistentes = new Set(existentes.map(a => a.numero));
          for (const anilha of backup.dados.anilhas) {
            if (numerosExistentes.has(anilha.numero)) { ignorados++; continue; }
            await tentar(`anilha ${anilha.numero}`, () => DB.add(DB.TABLES.ANILHAS, limparCamposDeControle(anilha)));
            numerosExistentes.add(anilha.numero);
          }
        }

        if (Array.isArray(backup.dados.ancestrais)) {
          const existentes = await DB.getAncestrais();
          const nomes = new Set(existentes.map(a => String(a.nome || '').toLowerCase()));
          for (const anc of backup.dados.ancestrais) {
            if (nomes.has(String(anc.nome || '').toLowerCase())) { ignorados++; continue; }
            await tentar(`ancestral ${anc.nome}`, () => DB.addAncestral(limparCamposDeControle(anc)));
            nomes.add(String(anc.nome || '').toLowerCase());
          }
        }

        if (Array.isArray(backup.dados.reproducoes)) {
          // Os ids das aves mudam ao restaurar num banco novo: religa fêmea/macho pela anilha.
          const avesAgora = await DB.getAll(DB.TABLES.AVES);
          const idPorAnilha = {};
          avesAgora.forEach(a => { if (a.anilha) idPorAnilha[a.anilha] = a.id; });

          // Não duplica se a mesma reprodução já existir (importar o mesmo backup duas vezes)
          const jaExistentes = await DB.getAll(DB.TABLES.REPRODUCOES);
          const assinatura = r => [r.femeaAnilha || r.femeaNome, r.cruza1, r.inicioChoco, r.primeiroOvo].join('|');
          const assinaturas = new Set(jaExistentes.map(assinatura));

          for (const rep of backup.dados.reproducoes) {
            if (assinaturas.has(assinatura(rep))) { ignorados++; continue; }
            const dadosRep = limparCamposDeControle(rep);
            if (dadosRep.femeaAnilha && idPorAnilha[dadosRep.femeaAnilha]) dadosRep.femeaId = idPorAnilha[dadosRep.femeaAnilha];
            if (dadosRep.machoAnilha && idPorAnilha[dadosRep.machoAnilha]) dadosRep.machoId = idPorAnilha[dadosRep.machoAnilha];
            await tentar('reprodução', () => DB.add(DB.TABLES.REPRODUCOES, dadosRep));
            assinaturas.add(assinatura(rep));
          }
        }

        if (Array.isArray(backup.dados.torneios) && backup.dados.torneios.length) {
          const existentes = await DB.getTorneios().catch(() => []);
          const chave = t => [t.categoria, t.etapa, String(t.data || '').slice(0, 10)].join('|');
          const jaTem = new Set(existentes.map(chave));
          for (const t of backup.dados.torneios) {
            if (jaTem.has(chave(t))) { ignorados++; continue; }
            // a listagem do admin já inclui o arquivo (arquivoUrl) de cada etapa
            await tentar(`copa ${t.categoria}`, async () => {
              const { id, ...resto } = t;
              await DB.addTorneio(resto);
            });
          }
        }

        // Configurações do site SUBSTITUEM as atuais, então perguntam à parte.
        const chavesBackup = backup.dados.config ? Object.keys(backup.dados.config) : [];
        if (chavesBackup.length && confirm(`O backup também tem ${chavesBackup.length} configurações do site (visual, notícias, fotos, vídeos, parceiros...).\n\nRestaurar essas configurações? Elas SUBSTITUEM as que estão no site agora.`)) {
          for (const chave of chavesBackup) {
            if (!CHAVES_CONFIG.includes(chave)) continue;
            await tentar(`configuração ${chave}`, () => DB.setConfig(chave, backup.dados.config[chave]));
          }
        }

        mostrarResumo(`<strong>Importação concluída</strong> · ${importados} importados · ${ignorados} ignorados (já existiam)${falhas ? ` · ⚠️ ${falhas} falharam` : ''}`);
        alert(`✅ Importação concluída!\n${importados} registros importados, ${ignorados} ignorados (já existiam).` +
              (falhas ? `\n\n⚠️ ${falhas} falharam:\n${erros.join('\n')}` : ''));
        atualizarStats();
      } catch (error) {
        alert('❌ Erro ao importar: ' + error.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

atualizarStats();
</script>
</body>
</html>
